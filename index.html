          {
            id: 1,
            q: `Perundingan Linggarjati menyepakati pengakuan de facto Belanda atas wilayah Republik Indonesia yang hanya mencakup Jawa, Sumatera, dan Madura. Keputusan ini memicu perdebatan sengit di dalam negeri hingga muncul golongan yang menentang Sutan Syahrir. Berdasarkan analisis situasi politik saat itu, mengapa kesepakatan wilayah tersebut memicu penolakan keras dari sebagian tokoh nasional?`,
            o: {
              A: `Kesepakatan tersebut memaksa Indonesia untuk membayar hutang perang pemerintah Hindia Belanda.`,
              B: `Wilayah di luar Jawa, Sumatera, dan Madura akan langsung diberikan kepada tentara Sekutu.`,
              C: `Pengakuan wilayah yang terbatas dianggap mencederai makna Proklamasi yang mengklaim seluruh wilayah bekas Hindia Belanda.`,
              D: `Belanda diberikan hak istimewa untuk mengeksploitasi sumber daya alam di pulau-pulau selain ketiga wilayah tersebut.`,
              E: `Indonesia harus mengubah sistem pemerintahannya menjadi parlementer agar diakui wilayahnya.`
            },
            a: `C`,
            p: `Proklamasi Kemerdekaan 17 Agustus 1945 mengklaim seluruh wilayah bekas jajahan Hindia Belanda sebagai wilayah RI. Pengakuan de facto yang hanya mencakup Jawa, Sumatera, dan Madura dianggap sebagai kemunduran diplomasi dan mencederai cita-cita kemerdekaan yang utuh.`
          },
          {
            id: 2,
            q: `Salah satu poin krusial di Linggarjati adalah pembentukan negara federasi (Republik Indonesia Serikat) dan Uni Indonesia-Belanda. Jika dianalisis dari kacamata politik kolonial, apa tujuan tersembunyi Belanda mengusulkan bentuk negara serikat (federal)?`,
            o: {
              A: `Mempercepat proses modernisasi sistem pemerintahan di daerah-daerah terpencil.`,
              B: `Memecah belah persatuan bangsa Indonesia agar lebih mudah dikendalikan oleh Belanda.`,
              C: `Meringankan beban ekonomi Belanda dalam membangun kembali infrastruktur yang hancur.`,
              D: `Memberikan kebebasan mutlak kepada kerajaan-kerajaan lokal untuk memerintah sendiri.`,
              E: `Mengakomodasi saran dari PBB agar tidak terjadi sentralisasi kekuasaan di Jawa.`

            p: `Strategi negara federal (BFO) digunakan Belanda sebagai taktik devide et impera (pecah belah). Dengan membentuk negara-negara boneka di luar wilayah RI, Belanda bertujuan memperlemah posisi tawar RI dan menjaga dominasinya di nusantara.`
          },
          {
            id: 3,
            q: `Perjanjian Renville menghasilkan Garis Demarkasi Van Mook yang berdampak pada keharusan mundurnya TNI dari kantong-kantong gerilya di wilayah yang diklaim Belanda. Dampak strategis yang paling merugikan bagi militer Indonesia dari kesepakatan ini adalah…`,
            o: {
              A: `TNI kehilangan dukungan senjata dari negara-negara simpatisan di luar negeri.`,

              C: `Banyak tentara Indonesia yang akhirnya memilih bergabung dengan militer Belanda (KNIL).`,
              D: `Terjadinya pemberontakan internal di tubuh TNI karena menolak berdamai dengan Sekutu.`,
              E: `Indonesia kehilangan hak untuk memproduksi senjata di wilayah Jawa Barat dan Jawa Timur.`

            a: `B`,
            p: `Garis Van Mook membuat wilayah RI semakin menyusut karena Belanda menetapkan garis sepihak. Konsekuensinya, kantong pertahanan TNI di wilayah Belanda harus dikosongkan (Hijrah), membuat pertahanan terpusat di wilayah Yogyakarta yang sempit.`

            q: `Jatuhnya Kabinet Amir Sjarifuddin tidak lepas dari penandatanganan Perjanjian Renville. Publik dan partai politik menarik dukungan mereka terhadap kabinetnya. Mengapa penandatanganan perjanjian tersebut berakibat fatal bagi karir politik Amir Sjarifuddin?`,

              A: `Ia dianggap terlalu berpihak pada tuntutan Amerika Serikat daripada kepentingan rakyat.`,
              B: `Kabinetnya gagal mendapatkan bantuan finansial pasca perjanjian ditandatangani.`,
              C: `Perjanjian tersebut mengharuskan pembubaran sebagian besar partai politik di Indonesia.`,

          },
          {
            id: 23,
            q: `Keberhasilan menguasai ibukota selama "hanya 6 jam" bernilai sangat krusial karena...`,
            o: {
              A: `Mampu menghancurkan lebih dari 50% kekuatan tempur militer Belanda.`,
              B: `Memberikan waktu bagi para pimpinan nasional untuk melarikan diri.`,
              C: `Mematahkan propaganda Belanda di PBB yang mengklaim bahwa Republik Indonesia dan TNI sudah hancur.`,
              D: `Memaksa Jenderal Sudirman untuk menghentikan perang gerilya.`,
              E: `Mendapatkan simpati dan bantuan senjata langsung dari Uni Soviet.`
            },
            a: `C`,
            p: `Serangan ini menjadi bukti tak terbantahkan bahwa TNI masih ada, yang berujung pada tekanan internasional bagi Belanda.`
          },
          {
            id: 24,
            q: `Peran Sultan Hamengkubuwono IX dalam Serangan Umum 1 Maret sangat strategis karena...`,
            o: {
              A: `Beliau menjadi penyumbang persenjataan tercanggih.`,
              B: `Sultan memiliki koneksi langsung dengan Ratu Belanda.`,
              C: `Selain diyakini sebagai penggagas ide serangan, kedudukannya yang dihormati Belanda melindungi komunikasi dan logistik para gerilyawan di keraton.`,
              D: `Beliau mengerahkan pasukan pengawal keraton di garis depan.`,
              E: `Sultan bertugas menangkap panglima tentara Belanda.`
            },
            a: `C`,
            p: `Sri Sultan HB IX memfasilitasi komunikasi, merencanakan ide dasar serangan, dan memberikan dukungan logistik krusial dari dalam keraton yang kebal penggeledahan Belanda.`
          },
          {
            id: 25,
            q: `Salah satu alasan Perundingan Linggariati dilaksanakan di daerah Kuningan, Jawa Barat adalah karena daerah tersebut dianggap netral. Mengapa aspek netralitas lokasi sangat krusial dalam perundingan awal antara Indonesia dan Belanda?`,
            o: {
              A: `Agar Perserikatan Bangsa-Bangsa (PBB) dapat memantau jalannya perundingan secara langsung.`,
              B: `Untuk menghindari intimidasi, unjuk kekuatan militer, dan tekanan psikologis dari kedua belah pihak yang sedang bersitegang di kota besar seperti Jakarta.`,
              C: `Karena Belanda merasa takut akan diserang oleh sisa-sisa pasukan Jepang di ibukota.`,
              D: `Linggarjati memiliki fasilitas komunikasi internasional terbaik di masa itu.`,
              E: `Atas instruksi langsung dari Lord Killearn yang ingin berlibur di daerah pegunungan.`
            },
            a: `B`,
            p: `Perundingan di kota besar yang sarat akan militer (seperti Jakarta yang diduduki Sekutu/NICA) rawan akan tekanan militer dan gesekan bersenjata. Linggarjati dipilih karena lokasinya yang netral, aman, dan jauh dari konsentrasi militer, sehingga negosiator dapat berunding tanpa tekanan.`
          },
          {
            id: 26,
            q: `Pasca disepakatinya Perundingan Linggarjati, Belanda justru sering melakukan penafsiran sepihak yang berujung pada Agresi Militer Belanda I (Juli 1947). Analisis motif utama (ekonomi-politik) Belanda melakukan Agresi Militer tersebut meskipun telah terikat perjanjian adalah…`,
            o: {
              A: `Ingin menghancurkan basis ideologi komunis yang mulai tumbuh di Indonesia.`,
              B: `Kebutuhan mendesak untuk menguasai daerah-daerah perkebunan subur dan sumber daya alam demi memulihkan perekonomian Belanda pasca Perang Dunia II.`,
              C: `Adanya desakan dari PBB agar Belanda segera menyelesaikan konflik melalui operasi militer terukur.`,
              D: `Merasa terancam oleh kekuatan angkatan laut Indonesia yang semakin modern.`,
              E: `Ingin menyelamatkan warga sipil Belanda yang masih ditawan di kamp-kamp pedalaman.`
            },
            a: `B`,
            p: `Tujuan utama Agresi Militer I (Operatie Product) adalah motif ekonomi. Belanda sangat membutuhkan suntikan dana untuk membangun negerinya yang hancur akibat PD II, sehingga mereka menargetkan wilayah perkebunan, pelabuhan, dan pertambangan milik RI.`
          },
          {
            id: 27,
            q: `Di atas geladak kapal USS Renville, Indonesia berada dalam posisi tawar diplomasi yang lemah pasca Agresi Militer I. Delegasi RI akhirnya terpaksa menyetujui pembentukan Negara Indonesia Serikat (NIS). Jika ditinjau dari strategi diplomasi, mengapa para tokoh RI bersedia menyetujui bentuk negara federal tersebut saat itu?`,
            o: {
              A: `Karena para pemimpin RI sudah kehilangan kepercayaan pada taktik gerilya Jenderal Sudirman.`,
              B: `Merupakan taktik mengulur waktu (buying time) untuk menarik simpati PBB dan memberikan kesempatan TNI menyusun kembali kekuatannya.`,
              C: `Adanya janji bantuan militer penuh dari Amerika Serikat jika Indonesia mau mengubah sistem ketatanegaraan.`,
              D: `Pemerintah RI kekurangan dana untuk membiayai administrasi negara berbentuk kesatuan.`,
              E: `Rakyat di berbagai daerah secara sukarela menuntut perubahan bentuk negara menjadi serikat.`
            },
            a: `B`,
            p: `Menerima syarat Renville adalah keputusan pahit demi menghindari kehancuran total RI oleh militer Belanda. Langkah diplomasi ini dipakai untuk mengamankan pengakuan internasional, mengulur waktu, dan menata ulang barisan pertahanan Republik.`
          },
          {
            id: 28,
            q: `Perjanjian Renville membawa dampak luar biasa bagi konstelasi politik internal, salah satunya adalah munculnya pemberontakan DI/TII di Jawa Barat oleh S.M. Kartosuwiryo. Bagaimana korelasi analitis antara Perjanjian Renville dengan meletusnya pemberontakan tersebut?`,
            o: {
              A: `Kartosuwiryo menganggap pemerintah pusat telah menyerah dengan ditariknya Divisi Siliwangi ke Yogyakarta, sehingga ia mengisi "kekosongan kekuasaan" di Jawa Barat untuk menolak Belanda.`,
              B: `Perjanjian Renville mewajibkan seluruh laskar Islam di Jawa Barat untuk menyerahkan senjata kepada NICA.`,
              C: `Pemerintah pusat membatalkan otonomi khusus untuk Jawa Barat sebagai syarat mutlak dari Perjanjian Renville.`,
              D: `Belanda menjanjikan dana besar bagi Kartosuwiryo jika ia mau mendirikan Negara Islam.`,
              E: `Divisi Siliwangi diperintahkan oleh kabinet Amir Sjarifuddin untuk menumpas kelompok keagamaan sebelum hijrah.`
            },
            a: `A`,
            p: `Perjanjian Renville mengharuskan wilayah yang diklaim Belanda (termasuk Jabar) dikosongkan oleh militer RI. Hijrahnya Siliwangi dianggap oleh Kartosuwiryo sebagai bukti kelemahan pemerintah RI. Ia menolak hijrah, tetap di Jabar memerangi Belanda, lalu memproklamasikan Negara Islam Indonesia (NII).`
          },
          {
            id: 29,
            q: `Meskipun KTN memfasilitasi Perjanjian Renville, lembaga ini tidak mampu mencegah Belanda melancarkan Agresi Militer II ke Yogyakarta. Kelemahan mendasar dari KTN sebagai instrumen penyelesaian konflik internasional adalah…`,
            o: {
              A: `KTN dipimpin oleh diplomat Inggris yang diam-diam memasok persenjataan ke militer Belanda.`,
              B: `KTN berstatus "Komisi Jasa Baik" yang tidak memiliki wewenang eksekutorial atau kekuatan menjatuhkan sanksi jika ada yang melanggar perjanjian.`,
              C: `Anggota KTN menolak untuk masuk ke wilayah pedalaman Indonesia karena alasan keamanan pribadi.`,
              D: `KTN secara resmi menuntut Indonesia untuk mengganti dasar ideologinya sebelum berunding lebih jauh.`,
              E: `KTN hanya bisa beroperasi secara legal jika disetujui langsung oleh Ratu Belanda.`
            },
            a: `B`,
            p: `KTN (Good Offices Committee) hanyalah fasilitator perdamaian. Ketika Belanda melanggar garis demarkasi dan melakukan Agresi Militer II, KTN tidak berdaya karena tidak dibekali hak untuk menjatuhkan sanksi militer maupun ekonomi.`
          },
          {
            id: 30,
            q: `Di dalam KTN, penunjukan negara anggota dilakukan oleh pihak yang berkonflik. Belanda menunjuk Belgia, Indonesia menunjuk Australia, dan AS disepakati sebagai pihak penengah. Secara politis, Belgia dipilih oleh Belanda karena…`,
            o: {
              A: `Belgia berjanji akan memberi pinjaman utang perang kepada pemerintah kolonial Belanda.`,
              B: `Secara historis dan politik di Eropa, Belgia memiliki kedekatan pandangan kolonial dan simpati kepentingan dengan Belanda.`,
              C: `Belgia memiliki angkatan laut terkuat yang mampu memblokade perairan Hindia Belanda.`,
              D: `Belgia merupakan satu-satunya anggota tetap Dewan Keamanan PBB yang menentang kemerdekaan Indonesia.`,
              E: `Belgia menawarkan wilayahnya sebagai tempat pengungsian para tentara NICA.`
            },
            a: `B`,
            p: `Pemilihan Belgia sangat logis karena sebagai sesama negara Eropa Barat yang memiliki ikatan sejarah (pernah berada di wilayah geografis yang berdekatan) dan kepentingan serupa, Belgia cenderung mendukung posisi diplomatik Belanda atas wilayah koloninya.`
          },
          {
            id: 31,
            q: `Perjanjian Roem-Royen pada hakikatnya adalah perundingan pendahuluan (preliminary) demi membuka jalan menuju Konferensi Meja Bundar (KMB). Poin keberhasilan diplomasi paling fundamental bagi eksistensi Indonesia dari perundingan ini adalah…`,
            o: {
              A: `Penyerahan kedaulatan langsung tanpa syarat atas seluruh wilayah kepulauan Indonesia.`,
              B: `Penarikan mundur seluruh kekuatan sekutu (Inggris) dari wilayah Jawa Timur secara permanen.`,
              C: `Dibebaskannya Soekarno-Hatta dan dipulihkannya pemerintahan Republik Indonesia di Yogyakarta sebagai subjek hukum yang sah.`,
              D: `Ditetapkannya ganti rugi perang dari pihak Belanda kepada rakyat yang menjadi korban agresi.`,
              E: `Dibubarkannya Negara Indonesia Timur (NIT) secara resmi oleh Van Mook.`
            },
            a: `C`,
            p: `Pasca Agresi Militer II, pimpinan RI ditawan. Perjanjian Roem-Royen berhasil memaksa Belanda membebaskan para pemimpin dan mengembalikan status pemerintah RI ke Yogyakarta, sehingga Indonesia bisa maju ke KMB sebagai pemerintahan yang sah dan diakui.`
          },
          {
            id: 32,
            q: `Dalam perundingan tersebut, delegasi Indonesia Mr. Moh. Roem bersikap sangat pragmatis dan menghindari tuntutan pengakuan kedaulatan seketika. Analisis rasional di balik strategi diplomasi Roem ini adalah…`,
            o: {
              A: `Ia menyadari bahwa posisi kekuatan militer milisi rakyat saat itu sudah hancur lebur tanpa sisa.`,
              B: `Fokus utama saat itu adalah menyelamatkan institusi negara (mengembalikan RI ke Jogja) terlebih dahulu, sebagai prasyarat mutlak sebelum perundingan final.`,
              C: `Mr. Moh Roem tidak ingin menyinggung perasaan delegasi Belanda yang mudah tersinggung.`,
              D: `Indonesia memang berencana untuk tidak hadir dalam sidang KMB di Den Haag jika dipaksa.`,
              E: `PBB telah menerbitkan resolusi yang melarang Indonesia merdeka sebelum tahun 1950.`
            },
            a: `B`,
            p: `Roem sadar bahwa tidak mungkin mendapat pengakuan kedaulatan di Roem-Royen. Ia berfokus selangkah demi selangkah; syarat utamanya adalah pemerintah RI dipulihkan dan bisa berfungsi normal terlebih dulu, baru kemudian membahas kedaulatan final di KMB.`
          },
          {
            id: 33,
            q: `Konferensi Meja Bundar (KMB) berhasil mengakhiri konflik bersenjata, namun dengan menyisakan "pil pahit" yaitu pembentukan Republik Indonesia Serikat (RIS). Mengapa konsep RIS ini pada akhirnya berbenturan kuat dengan semangat kemerdekaan bangsa?`,
            o: {
              A: `RIS mengharuskan Indonesia mengubah sistem perekonomiannya menjadi kapitalis absolut.`,
              B: `Konsep negara serikat dipandang melunturkan cita-cita Negara Kesatuan (NKRI) dan seolah mengesahkan negara-negara "boneka" buatan Belanda.`,
              C: `RIS mewajibkan seluruh pejabat daerah untuk mahir berbahasa Belanda dalam birokrasi.`,
              D: `Presiden RIS harus ditunjuk secara langsung oleh Parlemen Belanda di Den Haag.`,
              E: `RIS mengizinkan militer KNIL untuk menjadi polisi di seluruh negara bagian tanpa terkecuali.`
            },
            a: `B`,
            p: `Sejak Proklamasi 1945, cita-cita Indonesia adalah negara kesatuan (NKRI). RIS merupakan kompromi diplomatik yang memaksa RI berdiri sejajar dengan negara-negara buatan Van Mook (BFO), yang secara politis dirasakan mengancam persatuan nasional.`
          },
          {
            id: 34,
            q: `Salah satu resolusi rumit KMB adalah integrasi mantan prajurit KNIL (Tentara Kerajaan Hindia Belanda) ke dalam APRIS (Angkatan Perang Republik Indonesia Serikat). Dampak sosiopsikologis dan militer langsung dari peleburan paksa ini adalah…`,
            o: {
              A: `Menguatnya pertahanan udara Indonesia secara instan karena KNIL ahli menerbangkan pesawat.`,
              B: `Memicu gesekan, pemberontakan (seperti APRA dan Andi Azis), akibat perbedaan ideologi, arogansi, dan rasa ketidakpercayaan antara TNI dan mantan KNIL.`,
              C: `Menghemat APBN secara drastis karena seluruh fasilitas mantan KNIL langsung dijual oleh pemerintah.`,
              D: `Mudahnya Indonesia memadamkan gerakan separatis di luar Pulau Jawa.`,
              E: `Menghilangkan peran historis Jenderal Sudirman sebagai panglima tertinggi angkatan perang.`
            },
            a: `B`,
            p: `Memadukan dua pasukan yang bermusuhan bertahun-tahun dalam satu wadah (APRIS) menimbulkan konflik kejiwaan. Mantan KNIL merasa superior, sementara TNI meragukan kesetiaan mereka pada Republik. Inilah akar penyebab meletusnya pemberontakan militer awal 1950-an.`
          },
          {
            id: 35,
            q: `Bentrokan berdarah dalam Pertempuran 5 Hari di Semarang dipicu oleh keengganan pasukan Kidobutai (Jepang) menyerahkan senjatanya. Mengapa Jepang, yang telah bertekuk lutut pada Sekutu, justru sangat bersikeras mempertahankan persenjataannya dari pemuda Indonesia?`,
            o: {
              A: `Jepang diam-diam telah membuat pakta rahasia untuk menyerahkan wilayah Jawa Tengah kepada Belanda.`,
              B: `Pasukan Jepang terikat instruksi Sekutu untuk mempertahankan status quo dan menjaga keamanan hingga pendaratan militer Sekutu tiba.`,
              C: `Mayor Kido merencanakan aksi kudeta untuk mendirikan negara fasis baru di Semarang.`,
              D: `Jepang bermaksud membangun kembali basis pertahanan bawah tanah di daerah perbukitan Semarang.`,
              E: `Jepang merasa tidak pernah ditaklukkan secara fisik oleh kekuatan militer Indonesia dalam peperangan besar.`
            },
            a: `B`,
            p: `Setelah menyerah tanggal 15 Agustus 1945, Jepang mendapat perintah dari Komando Sekutu untuk mempertahankan ketertiban wilayah (status quo) dan dilarang menyerahkan senjata kepada siapapun selain Sekutu, yang berujung bentrok dengan pemuda RI yang butuh senjata.`
          },
          {
            id: 36,
            q: `Peristiwa gugurnya dr. Kariadi saat hendak mengecek tandon air di Candi (Siranda) yang diisukan diracun, memicu letupan perlawanan yang sangat masif. Kematian seorang dokter sipil ini menyulut emosi rakyat karena mencerminkan…`,
            o: {
              A: `Keberhasilan intelijen Jepang mengelabui pejuang Indonesia.`,
              B: `Ketidaksiapan paramedis Indonesia di medan tempur terbuka.`,
              C: `Arogansi membabi buta dari tentara Jepang yang membunuh tenaga medis tanpa mengindahkan nilai-nilai kemanusiaan internasional.`,
              D: `Kesalahan taktik koordinasi dari komandan TKR wilayah Semarang.`,
              E: `Pengorbanan sengaja untuk memancing intervensi Dewan Keamanan PBB.`
            },
            a: `C`,
            p: `Di masa perang, tenaga medis (non-kombatan) seharusnya dilindungi. Tindakan Jepang yang secara kejam menembak dr. Kariadi yang sedang menjalankan tugas kemanusiaan (mencegah rakyat keracunan) dianggap sebagai tindakan biadab yang membakar semangat pemuda Semarang.`
          },
          {
            id: 37,
            q: `Tragedi di Medan Area diawali oleh insiden direbut dan diinjaknya lencana Merah Putih milik pemuda Indonesia oleh oknum mantan tawanan Eropa. Dari perspektif kesadaran nasionalisme, mengapa insiden yang terkesan "sederhana" ini meledak menjadi pertempuran kota?`,
            o: {
              A: `Karena lencana tersebut terbuat dari logam mulia milik keluarga kesultanan.`,
              B: `Lencana merupakan representasi kedaulatan, pengakuan eksistensi, dan harga diri bangsa merdeka yang tak bisa ditawar jika dilecehkan.`,
              C: `Masyarakat Medan sedang mencari momentum provokasi untuk melucuti senjata Sekutu.`,
              D: `Penghuni hotel tersebut secara provokatif memutar lagu kebangsaan Belanda.`,
              E: `Lencana tersebut adalah identitas diplomat khusus yang dituqaskan oleh Soekarno.`
            },
            a: `B`,
            p: `Merah Putih (baik bendera maupun lencana) adalah simbol paling murni dari kemerdekaan yang baru direbut. Pelecahan terhadap simbol negara berarti merendahkan kemerdekaan itu sendiri, menyulut emosi kolektif rakyat yang masih euphoria atas kemerdekaan.`
          },
          {
            id: 38,
            q: `Pihak Sekutu di Medan memasang papan peringatan "Fixed Boundaries Medan Area" secara sepihak. Analisis implikasi politis dari pemasangan papan batas kota tersebut adalah…`,
            o: {
              A: `Sekutu berupaya memberikan otonomi khusus bagi pejuang sipil di wilayah pinggiran.`,
              B: `Bentuk pengingkaran de facto atas kedaulatan RI dengan mengklaim dan membatasi wilayah yang sah sebagai zona teritorial kekuasaan Sekutu/NICA.`,
              C: `Menjadi penanda berakhirnya pertempuran antara Indonesia dengan sisa tentara Jepang.`,
              D: `Taktik sekutu melindungi bangunan-bangunan cigar budaya dari ancaman bumi hangus.`,
              E: `Upaya membatasi gerak maju pasukan bantuan dari Aceh.`
            },
            a: `B`,
            p: `Dengan memasang garis demarkasi secara sepihak, Sekutu/Inggris seolah bertindak sebagai penguasa yang mengatur tata ruang negara orang lain. Hal ini jelas melanggar dan menantang yurisdiksi dan kedaulatan Republik Indonesia atas wilayah Medan.`
          },
          {
            id: 39,
            q: `Kemenangan TKR (Tentara Keamanan Rakyat) di Palagan Ambarawa, yang dikomandoi oleh Kolonel Sudirman, sangat legendaris berkat taktik "Supit Urang". Keberhasilan memukul mundur militer Inggris (Sekutu) yang bersenjata modern membuktikan bahwa...`,
            o: {
              A: `Persenjataan militer Inggris sebenarnya sudah usang dan berkarat peninggalan Perang Dunia I.`,
              B: `Taktik pengepungan gerilya yang cerdas dipadu dengan militansi rakyat mampu mengalahkan keunggulan teknologi militer modern asing.`,
              C: `Angkatan Udara RI memberikan bantuan perlindungan tempur yang mematikan dari atas.`,
              D: `Prajurit Inggris sangat rentan disuap dengan pasokan makanan dan obat-obatan.`,
              E: `Pasukan kolonial tidak memiliki pengalaman bertempur di wilayah beriklim tropis.`
            },
            a: `B`,
            p: `Taktik Supit Urang mengepung pasukan Sekutu dari dua sayap dan memutus suplai di tengah. Ini membuktikan bahwa strategi militer yang brilian dan didukung daya juang tinggi bisa mengungguli musuh yang lebih superior dalam hal persenjataan (Inggris sebagai pemenang PD II).`
          },
          {
            id: 40,
            q: `Ketegangan di Ambarawa mulai membara ketika NICA terbukti secara diam-diam mempersenjatai mantan tawanan perang Eropa (APWI). Tindakan ini memicu bentrokan karena pihak Indonesia menyadari bahwa...`,
            o: {
              A: `Para mantan tawanan tersebut akan diadili oleh Mahkamah Internasional terlebih dahulu.`,
              B: `Sekutu melanggar komitmen awal yang hanya datang untuk mengevakuasi tawanan, bukan untuk membangkitkan kembali kekuatan militer kolonial.`,
              C: `Senjata yang dibagikan tersebut adalah senjata hasil rampasan dari gudang TKR di Magelang.`,
              D: `Mantan tawanan Belanda berencana melakukan kudeta terhadap pimpinan militer Inggris.`,
              E: `Penduduk lokal Ambarawa akan dipaksa bergabung menjadi barisan depan (voorhoede) Belanda.`
            },
            a: `B`,
            p: `Perjanjian kedatangan Sekutu murni untuk urusan kemanusiaan (mengurus tawanan perang dan melucuti Jepang). Mempersenjatai KNIL yang baru bebas jelas merupakan agenda tersembunyi NICA untuk kembali merebut kekuasaan, melanggar komitmen netralitas tersebut.`
          },
          {
            id: 41,
            q: `Keputusan Letkol I Gusti Ngurah Rai menolak perundingan damai dengan Belanda dan memilih Perang Puputan (habis-habisan) mengandung nilai filosofis perjuangan yang sangat tinggi. Nilai utama dari penolakan tersebut bagi kedaulatan bangsa adalah…`,
            o: {
              A: `Bukti kegemaran taktik pertempuran frontal daripada perang gerilya.`,
              B: `Integritas mutlak pada Negara Kesatuan Republik Indonesia (NKRI) dan menolak keras tunduk pada iming-iming jabatan dalam negara boneka.`,
              C: `Ambisi pribadi untuk menjadikan wilayah Bali sebagai wilayah independen dari kekuasaan Jawa.`,
              D: `Adanya keraguan terhadap kemampuan lobi dari delegasi pemerintah pusat di Jakarta.`,
              E: `Keyakinan bahwa senjata magis pasukannya mampu menangkal peluru meriam Belanda.`
            },
            a: `B`,
            p: `Belanda merayu Ngurah Rai untuk tidak melawan dan membiarkan pembentukan Negara Indonesia Timur (NIT). Penolakannya yang berujung maut membuktikan keteguhan hatinya untuk setia menjaga Bali sebagai bagian tak terpisahkan dari Republik Indonesia.`
          },
          {
            id: 42,
            q: `Dalam pertempuran Margarana, Belanda dipaksa mengerahkan seluruh kekuatan militer di Bali, Lombok, bahkan mendatangkan bantuan pesawat pembom dari Makassar. Analisis dari eskalasi militer ini menunjukkan bahwa…`,
            o: {
              A: `Belanda sedang berlatih taktik tempur gabungan dengan pasukan sekutu lainnya.`,
              B: `Belanda sangat frustrasi dan gentar menghadapi perlawanan militan tak kenal kompromi dari sepasukan kecil Ciung Wanara.`,
              C: `Dewan Keamanan PBB telah memberikan mandat penuh kepada Belanda untuk membumihanguskan Bali.`,
              D: `I Gusti Ngurah Rai telah berhasil menyandera beberapa perwira tinggi militer Belanda.`,
              E: `Taktik gerilya puputan terbukti hanya bisa dikalahkan melalui blokade ekonomi.`
            },
            a: `B`,
            p: `Pengerahan alutsista masif melawan sekelompok pasukan lokal membuktikan bahwa pertahanan pasukan Ciung Wanara sangat merepotkan. Pasukan Ngurah Rai memberikan perlawanan luar biasa sehingga militer Belanda kewalahan dan harus memakai bom udara untuk mengakhiri puputan.`
          },
          {
            id: 43,
            q: `Tewasnya Jenderal A.W.S. Mallaby dijadikan alasan oleh Inggris untuk mengeluarkan ultimatum penyerahan senjata tanpa syarat di Surabaya. Jika ditelaah dari psikologi militer, kematian Mallaby membuat Inggris bertindak reaktif dan brutal karena…`,
            o: {
              A: `Kematian tersebut dianggap sebagai noda besar dan penghinaan luar biasa terhadap supremasi militer Kerajaan Inggris yang berstatus pemenang Perang Dunia.`,
              B: `Mallaby adalah calon pewaris tunggal kepemimpinan Sekutu di wilayah Asia Tenggara.`,
              C: `Mallaby sedang membawa dokumen rahasia pembagian wilayah dari Perserikatan Bangsa-Bangsa.`,
              D: `Inggris harus menutupi kelemahan taktik persenjataan mereka yang mulai kehabisan amunisi.`,
              E: `Para pemuda Surabaya berniat mengirimkan jasad Mallaby ke markas NICA sebagai pesan provokasi.`
            },
            a: `A`,
            p: `Inggris yang baru saja menang gemilang melawan kekuatan Fasis (Jerman-Jepang) di PD II merasa terhina ketika jenderal bintang satunya terbunuh oleh milisi pejuang sipil/lokal. Hal ini menghancurkan gengsi militer mereka, memicu balasan destruktif.`
          },
          {
            id: 44,
            q: `Perang kota 10 November di Surabaya melibatkan elemen masyarakat secara total, salah satunya akibat adanya Fatwa Resolusi Jihad dari KH. Hasyim Asy'ari (22 Oktober 1945). Peran vital resolusi tersebut dalam eskalasi pertempuran adalah...`,
            o: {
              A: `Mengubah Surabaya menjadi basis pembentukan negara berdasarkan hukum teokrasi Islam.`,
              B: `Menyuntikkan pembenaran teologis yang radikal bahwa membela tanah air adalah kewajiban agama (fardhu 'ain), sehingga menumbuhkan keberanian tanpa kenal takut mati dari kalangan santri.`,
              C: `Memaksa Komandan Sekutu untuk membuka ruang negosiasi antar tokoh agama sebelum bertempur.`,
              D: `Meredam emosi kaum milenial agar tidak terjadi pertumpahan darah.`,
              E: `Mewajibkan pemuda untuk membajak kapal perang musuh di pelabuhan Tanjung Perak.`
            },
            a: `B`,
            p: `Nasionalisme dan agama melebur menjadi satu. Resolusi Jihad meyakinkan rakyat bahwa mati melawan penjajah berarti mati syahid. Keyakinan inilah yang menjadi motor penggerak perlawanan rakyat tanpa takut menghadapi meriam dan tank Inggris.`
          },
          {
            id: 45,
            q: `Dalam peristiwa Bandung Lautan Api, pemerintah RI pusat menginstruksikan agar militer Indonesia mundur mengosongkan kota Bandung demi kepentingan kelancaran diplomasi. Di sisi lain, Kolonel A.H. Nasution memilih membakar wilayah selatan Bandung. Strategi bumi hangus ini diambil karena pertimbangan taktis...`,
            o: {
              A: `Bandung dinilai tidak memiliki nilai sejarah penting bagi masa depan negara.`,
              B: `Untuk mencegah infrastruktur perkotaan dan fasilitas militer dimanfaatkan secara utuh sebagai markas strategis yang kuat bagi Sekutu dan NICA.`,
              C: `Menghancurkan pangkalan rahasia komunis yang berada di sekitar alun-alun Bandung.`,
              D: `Merupakan balasan dendam karena markas TKR di wilayah utara telah dibom Sekutu.`,
              E: `Mengakomodir permintaan warga lokal yang ingin bermigrasi besar-besaran ke desa.`
            },
            a: `B`,
            p: `Daripada meninggalkan kota dalam kondisi utuh yang pasti akan memperkuat posisi militer musuh (menjadi benteng pertahanan NICA/Sekutu), membumihanguskan infrastruktur kota adalah jalan terbaik untuk melumpuhkan nilai taktis Bandung bagi penjajah.`
          },
          {
            id: 46,
            q: `Insiden perusakan gudang mesiu oleh Mohammad Toha di Dayeuhkolot merupakan salah satu fragmen paling heroik dalam peristiwa pengosongan Bandung. Aksi peledakan yang mengorbankan nyawanya sendiri ini secara militer sangat berdampak pada...`,
            o: {
              A: `Berakhirnya dominasi udara Sekutu karena pesawat mereka hancur.`,
              B: `Terhambatnya gerak operasional dan suplai logistik/amunisi dalam skala besar bagi militer musuh.`,
              C: `Menyelamatkan puluhan petinggi Republik yang disandera di dalam kompleks pergudangan tersebut.`,
              D: `Membuktikan kepada PBB bahwa pemuda Indonesia mampu merakit bahan peledak nuklir taktis.`,
              E: `Memancing simpati tentara bayaran dari Gurkha untuk berbalik memihak Indonesia.`
            },
            a: `B`,
            p: `Menghancurkan pusat penyimpanan persenjataan (gudang amunisi) adalah taktik sabotase klasik namun mematikan, yang langsung melumpuhkan kemampuan musuh untuk melancarkan serangan jarak jauh dan peperangan berskala besar di wilayah tersebut.`
          },
          {
            id: 47,
            q: `Serangan Umum 1 Maret 1949 terhadap ibukota Yogyakarta dirancang dengan sangat matang dan disetujui Jenderal Sudirman. Tujuan strategis utama dari serangan mendadak ini bukanlah untuk mengusir Belanda secara permanen saat itu juga, melainkan untuk...`,
            o: {
              A: `Menguasai kembali instalasi pemancar radio penyiaran secara permanen di keraton.`,
              B: `Menepis propaganda kebohongan Belanda di kancah internasional sekaligus membuktikan kepada United Nations Commission for Indonesia (UNCI) bahwa TNI dan negara Republik Indonesia masih eksis serta solid.`,
              C: `Melindungi jalur evakuasi pelarian Soekarno-Hatta menuju Sumatera Tengah.`,
              D: `Merampas pasokan senjata berat yang baru tiba dari negeri Belanda untuk memperkuat gerilya.`,
              E: `Menyediakan alasan yang sah agar tentara Amerika Serikat mendarat dan melakukan intervensi bersenjata.`
            },
            a: `B`,
            p: `Belanda berkampanye ke dunia luar bahwa RI telah tamat pasca Agresi Militer II. Serangan 1 Maret adalah "serangan politik dan psikologis". Dengan menguasai ibu kota walau sebentar, mata dunia (melalui pengamat PBB) terbuka bahwa RI dan kekuatan militernya masih utuh.`
          },
          {
            id: 48,
            q: `Taktik Serangan Umum dilaksanakan pada pagi hari (sekitar pukul 06.00 saat sirene berbunyi) dan pasukan TNI ditarik mundur kembali secara teratur setelah hanya menguasai kota selama 6 jam. Taktik "serang siang-mundur cepat" ini mengindikasikan kedisiplinan dan strategi...`,
            o: {
              A: `Ketidakmampuan logistik militer Indonesia untuk menyediakan ransum makan malam bagi prajurit.`,
              B: `Memanfaatkan elemen kejutan (element of surprise) di saat psikologi musuh lengah, dan mundur tepat waktu sebelum bala bantuan besar berlapis baja Belanda dari luar kota tiba, guna meminimalisir korban.`,
              C: `Mengikuti instruksi pembatasan jam operasional perang yang dikeluarkan langsung oleh Komite Palang Merah Internasional.`,
              D: `Taktik yang semata-mata disesuaikan dengan jadwal jam kerja para pegawai sipil Belanda di kota.`,
              E: `Kepanikan komando di lapangan yang gagal mempertahankan posisi setelah tengah hari.`
            },
            a: `B`,
            p: `Serangan gerilya modern sangat memperhitungkan efisiensi. Menguasai kota siang bolong memberi efek psikologis luar biasa (mempermalukan musuh), dan mundur pada jam 12.00 siang adalah perhitungan rasional untuk menghindari konfrontasi dengan tank bantuan Belanda yang dipanggil dari Magelang/Solo.`
          },
          {
            id: 49,
            q: `Pertempuran 5 Hari di Semarang diperparah oleh kaburnya tawanan tentara Jepang dari Pabrik Gula Cepiring yang sedang dipindahkan ke Penjara Bulu. Jika dianalisis dari kondisi psikologis pasukan Jepang saat itu, mengapa para tawanan tersebut memilih memberontak dan bergabung dengan batalion Kidobutai di Jatingaleh?`,
            o: {
              A: `Mereka mendapat instruksi rahasia dari Kaisar untuk merebut kembali pulau Jawa.`,
              B: `Mereka merasa terhina karena dilucuti oleh pemuda sipil Indonesia yang tidak memiliki pendidikan militer resmi.`,
              C: `Adanya jaminan dari pihak Sekutu bahwa tentara Jepang akan dijadikan pemimpin pemerintahan lokal di Jawa Tengah.`,
              D: `Mereka ingin mengamankan pasokan logistik pabrik gula untuk dibawa kembali ke Tokyo.`,
              E: `Para tawanan takut akan diadili oleh pengadilan militer Indonesia atas kejahatan perang.`
            },
            a: `B`,
            p: `Tentara Jepang (yang merasa memiliki tradisi militer Bushido yang kuat) merasa sangat gengsi dan terhina ketika senjata mereka dilucuti oleh pemuda/milisi lokal yang tidak terlatih. Ego militer inilah yang mendorong mereka memberontak dan bergabung dengan pasukan Mayor Kido untuk membalas dendam.`
          },
          {
            id: 50,
            q: `Dalam upaya menghentikan pertumpahan darah di Semarang, Gubernur Jawa Tengah, Mr. Wongsonegoro, ditangkap oleh pasukan Jepang saat mencoba melakukan perundingan damai. Tindakan Jepang menangkap seorang gubernur sipil yang datang untuk berunding menunjukkan bahwa…`,
            o: {
              A: `Jepang ingin menjadikan Mr. Wongsonegoro sebagai pemimpin boneka di Semarang.`,
              B: `Pasukan Jepang di lapangan sudah kehilangan rantai komando yang rasional dan mengabaikan etika diplomasi internasional.`,
              C: `Jepang menganggap Mr. Wongsonegoro sebagai mata-mata yang dikirim oleh NICA.`,
              D: `Adanya instruksi dari PBB untuk mengamankan pejabat sipil dari area peperangan.`,
              E: `Mr. Wongsonegoro menolak menyerahkan dokumen rahasia milik Sekutu.`
            },
            a: `B`,
            p: `Menangkap utusan damai (apalagi seorang Gubernur yang mewakili pemerintahan sah) melanggar konvensi perang manapun. Hal ini membuktikan bahwa pasukan Jepang di Semarang saat itu bertindak secara reaktif, emosional, dan tidak lagi mematuhi aturan diplomasi maupun rantai komando yang wajar.`
          },
          {
            id: 51,
            q: `Dalam Pertempuran Medan Area, Gubernur Sumatera Teuku Mohammad Hasan menolak keras ultimatum Brigjen T.E.D. Kelly yang meminta pemuda menyerahkan senjata. Sikap penolakan ini memberikan dampak psikologis yang besar bagi perlawanan rakyat, yaitu…`,
            o: {
              A: `Membuat rakyat ketakutan dan memilih mengungsi ke semenanjung Malaya.`,
              B: `Mengubah status pertempuran dari pemberontakan lokal menjadi perlawanan resmi yang direstui oleh institusi negara.`,
              C: `Memancing intervensi militer dari angkatan laut Amerika Serikat ke perairan Sumatera.`,
              D: `Memaksa pemuda untuk menyerang markas Jepang demi mendapatkan tambahan senjata.`,
              E: `Menjadikan Medan sebagai ibukota sementara Republik Indonesia menggantikan Jakarta.`
            },
            a: `B`,
            p: `Dukungan langsung dari seorang Gubernur (pejabat resmi negara) melegitimasi tindakan para pemuda. Perlawanan bersenjata bukan lagi dianggap sebagai aksi sporadis "pemberontak", melainkan perjuangan resmi yang didukung penuh oleh struktur pemerintahan Republik Indonesia di Sumatera.`
          },
          {
            id: 52,
            q: `Setelah terdesak dari pusat kota Medan, para pejuang tidak menyerah melainkan membentuk "Komando Resimen Laskar Rakyat Medan Area" di Tebing Tinggi. Strategi desentralisasi basis perlawanan ini membuktikan bahwa...`,
            o: {
              A: `Pejuang Indonesia kehabisan dana untuk menyewa gedung di pusat kota Medan.`,
              B: `Perjuangan bersifat teritorial luwes; hilangnya satu kota tidak berarti hancurnya komando perlawanan militer.`,
              C: `Tebing Tinggi memiliki pabrik senjata peninggalan Belanda yang belum dihancurkan.`,
              D: `Pejuang berniat memisahkan diri dari Republik Indonesia dan mendirikan negara Sumatera.`,
              E: `Pihak Sekutu tidak memiliki kendaraan militer untuk mengejar pejuang ke luar kota.`
            },
            a: `B`,
            p: `Taktik gerilya tidak bergantung pada penguasaan satu kota secara statis. Dengan memindahkan markas ke Tebing Tinggi, pejuang menunjukkan fleksibilitas strategi perang gerilya: mundur untuk konsolidasi, mempertahankan komando, dan terus merongrong pertahanan Sekutu dari luar kota.`
          },
          {
            id: 53,
            q: `Pemasangan papan "Fixed Boundaries Medan Area" oleh Sekutu di berbagai sudut kota memicu eskalasi konflik yang drastis. Secara hukum ketatanegaraan, mengapa pemasangan papan tersebut merupakan penghinaan bagi Indonesia?`,
            o: {
              A: `Papan tersebut ditulis menggunakan bahasa Belanda yang tidak dimengerti warga lokal.`,
              B: `Membuktikan bahwa Sekutu bertindak layaknya penguasa teritorial yang berhak membagi-bagi wilayah negara merdeka secara sepihak.`,
              C: `Pemasangan papan tersebut merusak fasilitas umum yang baru saja dibangun oleh pemerintah RI.`,
              D: `Sekutu mencantumkan ancaman hukuman mati bagi siapa saja yang melewati batas tersebut.`,
              E: `Papan tersebut dipasang di halaman masjid dan gereja utama di kota Medan.`
            },
            a: `B`,
            p: `Dengan menetapkan "batas resmi" secara sepihak, Sekutu tidak menghargai kedaulatan RI atas wilayahnya sendiri. Tindakan mengklaim wilayah administrasi suatu negara yang merdeka adalah bentuk pelanggaran kedaulatan dan pelecehan hukum tata negara.`
          },
          {
            id: 54,
            q: `Gugurnya Letkol Isdiman (komandan pasukan RI di Ambarawa) akibat serangan udara pesawat Mustang milik Sekutu justru membawa dampak balikan (boomerang effect) bagi pihak musuh. Dampak analitis dari peristiwa gugurnya Letkol Isdiman adalah…`,
            o: {
              A: `Pasukan TKR menyerah tanpa syarat karena kehilangan pemimpin utamanya.`,
              B: `Menarik perhatian PBB karena Sekutu menggunakan pesawat tempur canggih untuk melawan milisi sipil.`,
              C: `Turun gunungnya Panglima Besar Jenderal Sudirman secara langsung untuk memimpin pertempuran, yang melipatgandakan moril dan agresivitas pasukan TKR.`,
              D: `Sekutu harus membayar ganti rugi perang kepada keluarga Letkol Isdiman.`,
              E: `Militer Belanda (KNIL) menolak melanjutkan peperangan karena bersimpati pada Isdiman.`
            },
            a: `C`,
            p: `Letkol Isdiman adalah perwira kesayangan dan tangan kanan Sudirman. Gugurnya Isdiman membuat Jenderal Sudirman turun langsung memimpin pertempuran. Kehadiran pucuk pimpinan tertinggi TKR di garis depan ini menjadi katalisator yang membakar semangat tempur pasukan hingga berhasil memenangkan pertempuran.`
          },
          {
            id: 55,
            q: `Dalam Palagan Ambarawa, militer Inggris (Sekutu) sampai harus meminta bantuan serangan udara dari Royal Air Force (RAF) untuk membombardir posisi TKR. Pengerahan angkatan udara ini membuktikan bahwa…`,
            o: {
              A: `TKR berhasil mencuri tank-tank milik Sekutu dan menggunakannya untuk menyerang balik.`,
              B: `Kondisi geografis Ambarawa yang berbukit membuat pasukan infanteri Inggris terjebak dan kehabisan akal menembus kepungan TKR (Supit Urang).`,
              C: `Inggris sedang melakukan uji coba senjata baru pasca Perang Dunia II.`,
              D: `Cuaca buruk menghalangi pergerakan pasukan darat Sekutu dari Semarang.`,
              E: `TKR telah menggunakan senjata gas air mata yang membahayakan pasukan infanteri Inggris.`
            },
            a: `B`,
            p: `Pasukan darat Inggris benar-benar terkurung rapat oleh taktik Supit Urang. Karena infanteri dan kavaleri mereka tidak berkutik dan gagal mendobrak pertahanan TKR, komando Sekutu terpaksa memanggil bantuan dari udara (RAF) sebagai satu-satunya cara untuk memecah kepungan.`
          },
          {
            id: 56,
            q: `Sebelum pecahnya Puputan Margarana, Letkol I Gusti Ngurah Rai menulis surat balasan kepada Letkol J.B.T. Konig (perwira Belanda). Dalam suratnya, Ngurah Rai menegaskan bahwa "Bali bukanlah tempat untuk perundingan yang memecah belah". Surat ini secara esensial merepresentasikan…`,
            o: {
              A: `Keangkuhan militer pejuang lokal yang meremehkan kekuatan artileri Belanda.`,
              B: `Ketegasan ideologis bahwa urusan kedaulatan adalah urusan pusat di Jakarta, dan militer di daerah tidak akan berkompromi dengan tawaran negara federal (NIT).`,
              C: `Kesepakatan rahasia antara Ngurah Rai dan pasukan Jepang yang masih tersisa di Bali.`,
              D: `Penolakan atas tawaran uang tebusan dari Belanda untuk membebaskan tawanan.`,
              E: `Permintaan agar Konig menyerahkan posisinya sebagai penguasa militer di Bali timur.`
            },
            a: `B`,
            p: `Ngurah Rai menyadari bahwa Belanda selalu menggunakan taktik devide et impera. Penolakannya berunding di daerah menegaskan prinsip bahwa Bali adalah kesatuan tak terpisahkan dari RI, menolak segala bentuk bujukan untuk mendirikan Negara Indonesia Timur (NIT).`
          },
          {
            id: 57,
            q: `Pemicu langsung serbuan besar-besaran Belanda ke markas Ciung Wanara di desa Margarana adalah aksi pasukan I Gusti Ngurah Rai yang melucuti persenjataan polisi NICA di Tabanan. Mengapa aksi pelucutan senjata ini sangat memukul telak gengsi Belanda?`,
            o: {
              A: `Senjata yang dilucuti adalah senjata nuklir taktis yang dirahasiakan.`,
              B: `Polisi NICA di Tabanan dipimpin langsung oleh Gubernur Jenderal Van Mook.`,
              C: `Aksi tersebut membuktikan kelemahan fatal intelijen dan pertahanan NICA di wilayah yang mereka klaim telah sepenuhnya aman dan dikuasai.`,
              D: `Ngurah Rai menggunakan senjata tersebut untuk menembak jatuh pesawat sipil Belanda.`,
              E: `Pelucutan senjata dilakukan oleh barisan perempuan pejuang Bali.`
            },
            a: `C`,
            p: `Belanda selalu mempropagandakan bahwa Bali sudah damai dan berada di bawah kendali NICA. Aksi sukses Ciung Wanara merampas gudang senjata NICA di Tabanan secara kilat membantah klaim tersebut dan mempermalukan militer Belanda, sehingga mereka membalas dengan kekuatan penuh ke Margarana.`
          },
          {
            id: 58,
            q: `Pertempuran Puputan Margarana berakhir dengan gugurnya I Gusti Ngurah Rai beserta seluruh pasukannya (96 orang). Meskipun secara militer ini adalah sebuah kekalahan taktis karena kehilangan seluruh pasukan tempur, secara politis peristiwa ini bernilai kemenangan moral karena…`,
            o: {
              A: `Mengakibatkan pemerintah Belanda langsung memberikan kemerdekaan pada saat itu juga.`,
              B: `Mematahkan klaim sepihak Belanda di PBB yang menyebut seluruh rakyat Bali mendukung penuh pendirian Negara Indonesia Timur (NIT).`,
              C: `Menginspirasi PBB untuk membubarkan militer kerajaan Belanda.`,
              D: `Pasukan Belanda di Bali kehilangan seluruh amunisinya dan harus pulang ke Eropa.`,
              E: `Bali otomatis diakui sebagai provinsi otonom oleh dunia internasional.`
            },
            a: `B`,
            p: `Belanda berusaha meyakinkan dunia bahwa rakyat Timur (termasuk Bali) tidak ingin bergabung dengan RI. Perlawanan sampai mati (Puputan) dari Ngurah Rai membuktikan kepada dunia internasional bahwa ada penolakan keras dan pengorbanan nyata dari rakyat Bali terhadap kolonialisme Belanda.`
          },
          {
            id: 59,
            q: `Bung Tomo memanfaatkan siaran Radio Pemberontakan untuk mengobarkan semangat rakyat Surabaya. Dari perspektif analisis komunikasi massa pada masa krisis militer, efektivitas pidato Bung Tomo terletak pada...`,
            o: {
              A: `Penggunaan bahasa diplomatis tingkat tinggi yang mampu menyentuh simpati negara-negara Barat.`,
              B: `Kapasitasnya dalam menyajikan data statistik kekuatan militer Inggris untuk menakuti rakyat agar berlindung.`,
              C: `Pemilihan retorika yang memadukan pekik takbir dan nasionalisme kerakyatan, yang memicu kebangkitan militansi bawah sadar massa.`,
              D: `Perintah taktis yang sangat spesifik mengenai formasi barisan militer di lapangan.`,
              E: `Kemampuannya menerjemahkan ancaman Sekutu ke dalam bahasa Jawa krama inggil.`
            },
            a: `C`,
            p: `Bung Tomo bukan komandan lapangan yang memberi instruksi taktis militer. Kekuatannya adalah pada retorika agitasi-propaganda. Dengan memadukan seruan agamis (Takbir) dan gaya bahasa kerakyatan (arek-arek Suroboyo), ia menyentuh lapisan emosi terdalam rakyat untuk berani mati melawan penjajah.`
          },
          {
            id: 60,
            q: `Inggris memprediksi bahwa Surabaya dapat ditaklukkan dalam waktu 3 hari. Namun kenyataannya, pertempuran berlangsung sangat alot hingga 3 minggu. Faktor utama yang menyebabkan melesetnya prediksi intelijen militer Inggris adalah...`,
            o: {
              A: `Inggris tidak menyangka bahwa TKR memiliki pasokan pesawat pembom peninggalan Jepang.`,
              B: `Munculnya struktur pertahanan komando horizontal (keterlibatan kiai, santri, laskar rakyat, dan pemuda lintas etnis) yang tidak bergantung pada satu komandan pusat.`,
              C: `Datangnya bantuan satu divisi penuh tentara dari Uni Soviet secara diam-diam.`,
              D: `Adanya cuaca ekstrem yang membuat meriam-meriam kapal perang Inggris tidak bisa ditembakkan.`,
              E: `Wali kota Surabaya mengancam akan meracuni aliran sungai jika Inggris menyerang.`
            },
            a: `B`,
            p: `Prediksi militer klasik mengasumsikan jika pusat komando dihancurkan, pasukan akan menyerah. Di Surabaya, perlawanan bersifat "semesta" (melibatkan seluruh lapisan masyarakat tanpa hirarki militer kaku). Saat satu pos hancur, laskar santri atau pemuda kampung di tempat lain akan otomatis mengambil alih perlawanan, membuat pembersihan kota menjadi sangat lambat.`
          },
          {
            id: 61,
            q: `Dampak dari Pertempuran Surabaya bergema hingga ke markas PBB. Peristiwa 10 November secara tidak langsung merugikan posisi diplomasi Belanda (dan Sekutu) karena...`,
            o: {
              A: `Inggris dituntut oleh Mahkamah Internasional atas kejahatan perang genosida.`,
              B: `Perlawanan masif rakyat membantah kebohongan propaganda Belanda yang selama ini menyebut RI hanyalah kelompok "fasis buatan Jepang" tanpa dukungan rakyat.`,
              C: `Indonesia berhasil menyandera seluruh diplomat Belanda di Surabaya.`,
              D: `Amerika Serikat langsung menjatuhkan sanksi embargo ekonomi kepada Inggris.`,
              E: `Pemerintah RI pusat di Jakarta memutuskan hubungan diplomatik dengan seluruh negara Eropa.`
            },
            a: `B`,
            p: `Belanda selalu mengklaim bahwa Republik Indonesia hanyalah boneka fasis Jepang dan rakyat sebenarnya ingin Belanda kembali. Pertempuran heroik rakyat sipil Surabaya membuka mata dunia (melalui jurnalis asing yang meliput) bahwa rakyat Indonesia benar-benar mendukung kemerdekaan dan siap mati untuk itu.`
          },
          {
            id: 62,
            q: `Eksodus (pengungsian) massal sekitar 200.000 penduduk Bandung yang meninggalkan kota yang terbakar menuju pegunungan di selatan bukanlah sekadar pelarian karena panik, melainkan sebuah bentuk "perlawanan pasif". Makna dari perlawanan pasif ini adalah...`,
            o: {
              A: `Menunggu bala bantuan dari pasukan Siliwangi untuk menyerang balik.`,
              B: `Menolak memberikan fasilitas sipil, tenaga kerja, dan dukungan ekonomi logistik apa pun kepada pemerintahan NICA/Sekutu yang akan menduduki kota.`,
              C: `Upaya memancing pasukan Sekutu agar tersesat di daerah pegunungan berhutan lebat.`,
              D: `Memboikot seluruh produk pertanian yang akan dikirim ke Jakarta.`,
              E: `Menyerahkan sepenuhnya tanggung jawab perang kepada para pemuda milisi.`
            },
            a: `B`,
            p: `Jika warga tetap tinggal, mereka akan dikontrol, dikenakan pajak, dan dipaksa bekerja untuk Sekutu/NICA. Dengan mengosongkan kota bersamaan dengan aksi bumi hangus, rakyat meninggalkan "kota mati" bagi Sekutu, yang berarti memutus total dukungan sosial-ekonomi bagi pihak penjajah.`
          },
          {
            id: 63,
            q: `Dalam kronologi Bandung Lautan Api, meledaknya gudang mesiu Sekutu di Dayeuhkolot oleh Mohammad Toha sangat krusial dalam menunjang keberhasilan mundurnya pasukan TRI (Tentara Republik Indonesia). Hal ini dikarenakan...`,
            o: {
              A: `Ledakan tersebut menewaskan Komandan Tertinggi Sekutu di Jawa Barat.`,
              B: `Ledakan yang sangat masif menciptakan kekacauan di kubu Sekutu dan menghentikan pengejaran musuh terhadap gelombang pengungsian TRI dan rakyat.`,
              C: `Asap dari ledakan tersebut digunakan sebagai sinyal bagi pesawat udara RI untuk menjatuhkan bom.`,
              D: `Gudang mesiu tersebut menyimpan cetak biru strategi penyerangan NICA ke Yogyakarta.`,
              E: `Menghancurkan dokumen utang piutang pemerintah daerah Bandung kepada pemerintah kolonial.`
            },
            a: `B`,
            p: `Gudang di Dayeuhkolot adalah gudang amunisi raksasa. Menghancurkannya bukan hanya melumpuhkan kemampuan logistik perang musuh, tetapi ledakannya yang dahsyat memecah konsentrasi dan pergerakan pasukan musuh, memberikan waktu emas bagi TRI dan rakyat untuk mundur ke selatan dengan aman.`
          },
          {
            id: 64,
            q: `Keputusan Kolonel A.H. Nasution membumihanguskan Bandung merupakan titik temu (middle ground) antara instruksi diplomasi dari Perdana Menteri Sjahrir dan tuntutan militansi dari para pejuang. Analisis yang tepat menggambarkan "titik temu" tersebut adalah...`,
            o: {
              A: `Kota diserahkan utuh kepada Sekutu (memenuhi diplomasi), tetapi pemerintahan sipil tetap dijalankan oleh orang Indonesia (memenuhi militansi).`,
              B: `TRI meninggalkan kota untuk menghindari perang kota sesuai perintah PM Sjahrir, namun kota dihancurkan terlebih dahulu agar tidak bisa dimanfaatkan musuh sesuai kehendak pejuang.`,
              C: `Menyerang markas Sekutu di utara (militansi), lalu mengajak mereka berunding damai di selatan (diplomasi).`,
              D: `Mengizinkan NICA masuk ke Bandung (diplomasi), dengan syarat mereka membayar ganti rugi pemakaian gedung (militansi).`,
              E: `Membakar setengah kota untuk menakuti musuh, lalu menyerahkan sisanya kepada PBB.`
            },
            a: `B`,
            p: `PM Sjahrir memerintahkan pengosongan agar tidak merusak proses perundingan dengan Sekutu (diplomasi). Pejuang marah jika harus menyerah begitu saja. Nasution mengambil jalan tengah: mematuhi perintah mundur (mengosongkan kota), tapi memastikan kota itu tidak berguna bagi musuh dengan membakarnya (memuaskan hasrat tempur militer/pejuang).`
          },
          {
            id: 65,
            q: `Serangan Umum 1 Maret 1949 dilakukan secara mendadak pada pukul 06.00 WIB tepat ketika sirene jam malam berakhir. Mengapa pemilihan waktu (timing) "pagi hari setelah jam malam berakhir" ini menunjukkan kecerdasan intelijen taktis TNI?`,
            o: {
              A: `Karena tentara Belanda dilarang oleh PBB untuk menggunakan senjata sebelum matahari terbit.`,
              B: `Pada waktu tersebut, psikologis dan kesiagaan tentara Belanda sedang dalam kondisi paling rendah karena pergantian jadwal jaga malam ke pagi.`,
              C: `TNI ingin menunggu warga sipil berangkat ke pasar agar bisa berbaur untuk menyusup ke markas musuh.`,
              D: `Cahaya matahari pagi menyilaukan pandangan para penembak jitu Belanda yang berada di menara pengawas.`,
              E: `Senjata TKR mayoritas hanya bisa berfungsi jika cuaca sudah mulai hangat.`
            },
            a: `B`,
            p: `Pukul 06.00 adalah titik di mana jam malam berakhir. Pasukan yang berjaga semalaman sedang lelah dan bersiap diganti, sementara pasukan pengganti belum sepenuhnya siap (shift change). Memukul musuh di titik transisi ini adalah strategi intelijen yang brilian karena element of surprise tercapai maksimal.`
          },
          {
            id: 66,
            q: `Berita keberhasilan Serangan Umum 1 Maret segera disebarkan melalui radio PC AURI di Playen, Gunung Kidul, yang kemudian diteruskan ke Sumatera, lalu ke India, hingga sampai ke PBB. Peran krusial stasiun radio klandestin (rahasia) ini bagi masa depan Indonesia adalah…`,
            o: {
              A: `Mengancam negara-negara tetangga agar segera mengirimkan bantuan persenjataan.`,
              B: `Menembus blokade informasi total yang diterapkan Belanda, sehingga kebenaran eksistensi RI dan TNI bisa didengar oleh dunia internasional.`,
              C: `Menyiarkan instruksi langsung dari Jenderal Sudirman kepada seluruh rakyat untuk menyerang istana negara.`,
              D: `Mendapat keuntungan finansial dari iklan yang disiarkan ke luar negeri.`,
              E: `Memandu pesawat tempur sisa-sisa Jepang untuk menjatuhkan logistik di Yogyakarta.`
            },
            a: `B`,
            p: `Tanpa adanya jaringan radio pemancar rahasia di Gunung Kidul ini, keberhasilan menguasai Yogyakarta hanya akan menjadi kemenangan lokal yang tidak diketahui siapa pun. Menembus blokade informasi Belanda adalah kunci agar fakta lapangan ini sampai ke delegasi PBB (UNCI) di luar negeri.`
          },
          {
            id: 67,
            q: `Dalam persiapan Serangan Umum 1 Maret, Sri Sultan Hamengkubuwono IX mengusulkan ide serangan langsung ke ibukota dan memberikan izin keraton digunakan sebagai tempat persembunyian logistik/rapat. Keistimewaan status Sultan HB IX yang menguntungkan strategi ini adalah…`,
            o: {
              A: `Beliau memiliki pasukan pengawal keraton yang jumlahnya jauh lebih besar dari tentara Belanda.`,
              B: `Militer Belanda terikat aturan ketat dan rasa segan untuk tidak menggeledah atau merusak kawasan keraton yang dipimpin oleh Raja Jawa yang dihormati.`,
              C: `Sultan HB IX menjabat sebagai perwakilan resmi PBB di wilayah Yogyakarta.`,
              D: `Belanda memiliki utang budi karena Sultan menyumbangkan dana bagi pemulihan ekonomi Eropa.`,
              E: `Sultan memiliki senjata penangkal udara otomatis yang dipasang di benteng keraton.`
            },
            a: `B`,
            p: `Sri Sultan HB IX adalah figur kharismatik yang dihormati baik oleh rakyat maupun pihak Belanda secara politis. Belanda sangat menjaga gengsi agar tidak dituduh merusak tradisi keraton, sehingga wilayah keraton menjadi "zona aman" (imunitas de facto) yang dimanfaatkan sebagai kantong koordinasi TNI dengan aman.`
          },
          {
            id: 68,
            q: `Bagi perundingan di tingkat internasional, peristiwa mundurnya pasukan TNI dari Yogyakarta setelah 6 jam berkuasa (pukul 12.00 siang) sering kali dieksploitasi Belanda sebagai "bukti kekalahan gerombolan TNI yang lari ketakutan". Namun di sidang PBB, diplomasi Indonesia membalas argumen tersebut dengan analisa meyakinkan, yaitu…`,
            o: {
              A: `Menjelaskan bahwa penarikan mundur itu adalah perintah langsung dari Dewan Keamanan PBB.`,
              B: `Menyatakan bahwa tujuan utama bukan menduduki kota secara permanen tanpa logistik memadai, melainkan sebuah manuver taktis terukur untuk membuktikan TNI memiliki sistem komando yang sanggup melancarkan serangan masif terorganisir.`,
              C: `Membekerkan data bahwa TNI kehabisan amunisi karena gudang senjata di luar kota diledakkan.`,
              D: `Menyalahkan pemimpin pasukan lokal yang salah membaca jam instruksi mundur.`,
              E: `Berdaih bahwa pasukan TNI sedang bersiap melaksanakan ibadah salat zuhur.`
            },
            a: `B`,
            p: `Belanda mengejek TNI yang lari. Delegasi RI di PBB dengan cerdas memutarbalikkan narasi itu: menguasai ibu kota yang dijaga sangat ketat walau hanya 6 jam membutuhkan koordinasi intelijen, komando, dan logistik tingkat tinggi. Mundur secara teratur tepat sebelum tank musuh tiba justru membuktikan TNI adalah pasukan profesional yang disiplin, bukan "gerombolan liar" seperti tuduhan Belanda.`
          },
          {
            id: 69,
            q: `Jika kita membandingkan taktik antara Pertempuran Ambarawa (militer terbuka) dan Serangan Umum 1 Maret (serangan kejut politis), perbedaan tujuan strategis yang paling menonjol dari kedua pertempuran ini adalah…`,
            o: {
              A: `Ambarawa bertujuan menghancurkan kekuatan fisik Sekutu untuk mencegah perluasan wilayah, sedangkan SU 1 Maret bertujuan menciptakan efek kejut psikologis untuk modal tawar menawar di meja perundingan internasional.`,
              B: `Ambarawa digerakkan secara spontan tanpa komando, sementara SU 1 Maret diawasi langsung oleh Presiden Soekarno.`,
              C: `Ambarawa menggunakan taktik modern, sedangkan SU 1 Maret murni menggunakan senjata tradisional.`,
              D: `Ambarawa merupakan perlawanan menuntut ganti rugi perang, sedangkan SU 1 Maret menuntut otonomi daerah.`,
              E: `Kedua pertempuran tersebut memiliki tujuan yang sama, yaitu mendirikan negara yang lepas dari pengaruh Amerika Serikat.`
            },
            a: `A`,
            p: `Palagan Ambarawa adalah murni pertempuran fisik-teritorial untuk memukul mundur dan mengusir musuh (Sekutu/Inggris) dari wilayah pedalaman Jawa Tengah. Sedangkan Serangan Umum 1 Maret tidak didesain untuk merebut kota selamanya, melainkan "serangan politik bersenjata" untuk mengirim pesan ke PBB bahwa narasi Belanda yang menyebut RI telah mati adalah kebohongan.`
          },
          {
            id: 70,
            q: `Perhatikan daftar tokoh berikut!

1. Jenderal Sudirman
2. Sri Sultan Hamengkubuwono IX
3. Letkol Soeharto
4. A.W.S. Mallaby
Tokoh-tokoh yang memiliki andil krusial dalam keberhasilan Serangan Umum 1 Maret 1949 adalah…`,
            o: {
              A: `1, 2, dan 3`,
              B: `1 dan 3`,
              C: `2 dan 4`,
              D: `4 saja`,
              E: `Semua benar`
            },
            a: `A`,
            p: `Serangan Umum 1 Maret diinisiasi oleh gagasan Sultan HB IX (2), direstui oleh Panglima Besar Jenderal Sudirman (1), dan secara taktis komando lapangan di sektor barat dan pusat dipimpin oleh Letkol Soeharto (3). Mallaby (4) adalah perwira Inggris yang tewas di Surabaya.`
          },
          {
            id: 71,
            q: `Hampir seluruh insiden pertempuran di awal kemerdekaan (Semarang, Surabaya, Ambarawa, Medan) melibatkan benturan awal dengan pasukan Sekutu (AFNEI). Alasan utama mengapa Sekutu yang awalnya disambut netral berubah menjadi sasaran amarah rakyat dan pejuang Indonesia adalah…`,
            o: {
              A: `Sekutu secara resmi mewajibkan pemuda Indonesia masuk wajib militer untuk dikirim ke Jepang.`,
              B: `Sekutu melanggar komitmennya dengan membonceng NICA (Belanda) dan secara terang-terangan mempersenjatai mantan tawanan militer kolonial untuk kembali berkuasa.`,
              C: `Tentara Sekutu melakukan perampasan hasil bumi untuk dijual kembali ke pasar Eropa.`,
              D: `Sekutu mendirikan pos penjagaan yang menghalangi warga pribumi melakukan aktivitas keagamaan.`,
              E: `Karena propaganda provokatif yang disiarkan terus-menerus melalui radio oleh tentara Jepang yang bersembunyi.`
            },
            a: `B`,
            p: `Mandat awal Sekutu murni untuk mengurus tawanan perang dan melucuti Jepang (kemanusiaan dan pemulangan). Rakyat Indonesia awalnya koperatif. Bentrokan meledak seketika ketika terbukti NICA ikut membonceng di belakang Sekutu dan mulai mempersenjatai KNIL yang mengancam kedaulatan kemerdekaan.`
          },
          {
            id: 72,
            q: `Mencermati pola perjuangan antara diplomasi (Perjanjian Linggarjati, Renville, Roem Royen) dan perjuangan fisik bersenjata (Bandung Lautan Api, Puputan Margarana, SU 1 Maret), dapat ditarik kesimpulan historis analitis bahwa...`,
            o: {
              A: `Perjuangan diplomasi selalu menghancurkan hasil jerih payah perlawanan militer di lapangan.`,
              B: `Kemerdekaan mutlak Indonesia hanya bisa diraih melalui jalur militer murni tanpa campur tangan PBB.`,
              C: `Keduanya merupakan dua sisi mata uang; diplomasi tidak akan didengar internasional tanpa adanya eksistensi pembuktian kekuatan militer, dan kemenangan militer membutuhkan pengesahan hukum melalui meja diplomasi.`,
              D: `Militer Indonesia menolak sepenuhnya seluruh hasil kompromi dari kalangan elit diplomat sipil.`,
              E: `Pihak kolonial Belanda hanya mematuhi kesepakatan diplomasi jika mereka memenangkan pertempuran di lapangan.`
            },
            a: `C`,
            p: `Ini adalah sintesis sejarah revolusi kemerdekaan RI. Strategi diplomasi dan perlawanan fisik saling melengkapi. Kekuatan militer (seperti SU 1 Maret) memberi posisi tawar (bargaining power) bagi diplomat (Roem, Sjahrir) di meja perundingan. Sebaliknya, kemenangan di medan laga harus diikat secara legal di mata hukum internasional (KMB) agar diakui kedaulatannya secara resmi.`
          },
          {
            id: 73,
            q: `Pemindahan tawanan tentara Jepang dari Pabrik Gula Cepiring ke Penjara Bulu di Semarang memicu upaya pelarian dan pemberontakan. Jika dianalisis dari segi keamanan, mengapa pemuda Semarang awalnya bersikeras memindahkan para tawanan Jepang tersebut ke pusat kota?`,
            o: {
              A: `Agar tawanan dapat dijadikan pekerja paksa untuk membangun pertahanan kota.`,
              B: `Untuk mencegah pasukan Jepang melakukan sabotase pabrik gula dan menggabungkan diri dengan pasukan Kidobutai di Jatingaleh.`,
              C: `Pemuda Semarang bermaksud menyerahkan tawanan langsung kepada Gubernur Mr. Wongsonegoro.`,
              D: `Untuk ditukarkan dengan senjata milik tentara Sekutu yang segera mendarat.`,
              E: `Menjadikan tawanan Jepang sebagai sandaera apabila Belanda menjatuhkan bom di kota Semarang.`
            },
            a: `B`,
            p: `Tawanan militer Jepang di luar kota sangat berisiko melakukan konsolidasi atau menyabotase infrastruktur ekonomi (pabrik gula). Pemindahan ke Penjara Bulu (pusat kota) bertujuan agar tawanan lebih mudah diawasi dan tidak bergabung dengan pasukan Jepang bersenjata di Jatingaleh.`
          },
          {
            id: 74,
            q: `Tandon air di Siranda (Candi) menjadi objek sangat vital yang dipertahankan dalam pertempuran Semarang hingga menyebabkan gugurnya dr. Kariadi. Secara taktis dan sosiologis, mengapa tandon air ini menjadi pusat pusaran konflik?`,
            o: {
              A: `Tandon tersebut merupakan jalan rahasia bawah tanah menuju pelabuhan.`,
              B: `Pasukan Jepang menyembunyikan senjata terkuat mereka di dasar tandon.`,
              C: `Air bersih adalah infrastruktur penyokong kehidupan seluruh warga kota; isu percunan tandon akan memicu kepanikan massal dan kelumpuhan kota.`,
              D: `Sekutu menjanjikan bayaran mahal jika pemuda berhasil mempertahankan tandon tersebut.`,
              E: `Tandon air tersebut merupakan markas utama badan intelijen Republik Indonesia.`
            },
            a: `C`,
            p: `Dalam perang kota, objek vital seperti pasokan air, listrik, dan komunikasi adalah kunci bertahan hidup. Isu bahwa Jepang meracuni sumber air minum utama warga Semarang adalah bentuk teror psikologis yang bisa melumpuhkan warga, sehingga perlindungannya sangat krusial.`
          },
          {
            id: 75,
            q: `Setelah pertempuran berdarah selama lima hari, pertempuran baru benar-benar berhenti setelah pasukan Sekutu (Inggris) mendarat pada 20 Oktober 1945. Mengapa kedatangan Sekutu saat itu justru berhasil menghentikan pertempuran antara pemuda dan Jepang?`,
            o: {
              A: `Sekutu langsung menembak mati seluruh komandan pasukan Jepang di Semarang.`,
              B: `Pasukan Jepang memang sedang menunggu instruksi dari Sekutu untuk menyerahkan senjata sesuai kesepakatan internasional.`,
              C: `Pemuda Semarang takut dengan persenjataan berat yang dibawa Sekutu.`,
              D: `Sekutu menjanjikan kemerdekaan penuh bagi Jawa Tengah jika pertempuran dihentikan.`,
              E: `Sekutu membayar ganti rugi kepada keluarga pemuda yang menjadi korban.`
            },
            a: `B`,
            p: `Pasukan Jepang terikat kewajiban untuk menjaga status quo dan hanya boleh menyerahkan senjatanya kepada pasukan Sekutu (sebagai pemenang PD II), bukan kepada laskar pemuda Indonesia. Ketika Sekutu tiba, Jepang akhirnya melucuti senjata mereka secara resmi kepada Sekutu, sehingga kontak senjata dengan pemuda mereda.`
          },
          {
            id: 76,
            q: `Pembangunan Monumen Tugu Muda di Semarang didedikasikan untuk mengenang pertempuran 5 hari. Secara filosofis kesejarahan, monumen ini melambangkan...`,
            o: {
              A: `Kemenangan mutlak tentara Jepang melawan pasukan Belanda.`,
              B: `Penghargaan khusus bagi pimpinan militer Sekutu yang mendamaikan Semarang.`,
              C: `Perjuangan dan pengorbanan rakyat semesta serta pemuda yang dengan gagah berani mempertahankan kemerdekaan dari sisa-sisa kekuatan fasisme militer Jepang.`,
              D: `Monumen perdamaian antara Indonesia dan Jepang dalam membangun ekonomi Asia.`,
              E: `Titik nol kota Semarang dalam menentukan batas wilayah dengan daerah lain.`
            },
            a: `C`,
            p: `Tugu Muda adalah simbol heroisme dan kebangkitan "pemuda" dan rakyat sipil Semarang yang berani mempertaruhkan nyawa melawan pasukan Jepang yang terlatih, membuktikan militansi mempertahankan proklamasi.`
          },
          {
            id: 77,
            q: `Pertempuran di Medan Area melibatkan banyak kelompok laskar pemuda bersenjata (seperti Napindo, Pesindo, dan Barisan Merah) sebelum TNI terbentuk kuat. Fenomena munculnya berbagai laskar ini membuktikan bahwa...`,
            o: {
              A: `Terjadi perebutan kekuasaan antar suku di wilayah Sumatera Utara.`,
              B: `Kesadaran mempertahankan kemerdekaan tumbuh secara akar rumput dari berbagai elemen ideologi massa, meskipun belum ada komando tunggal yang solid.`,
              C: `Pemerintah pusat di Jakarta melarang pembentukan angkatan perang resmi di wilayah Sumatera.`,
              D: `Sekutu sengaja mendanai kelompok-kelompok pemuda untuk saling memusuhi.`,
              E: `Laskar-laskar tersebut berjuang demi upah dari pemerintahan militer Jepang.`
            },
            a: `B`,
            p: `Beragam laskar pemuda dengan berbagai latar belakang ideologi di Medan menunjukkan bahwa perlawanan revolusi bersifat spontan dari bawah (grassroot). Kesadaran nasionalisme tumbuh merata, namun di awal revolusi belum terorganisir dalam satu komando terpusat.`
          },
          {
            id: 78,
            q: `Ketika pasukan pejuang Indonesia terdesak keluar dari kota Medan, mereka tidak membubarkan diri, melainkan membangun jalur koordinasi yang disebut "Komando Resimen Laskar Rakyat Medan Area" di Tebing Tinggi. Strategi desentralisasi basis perlawanan ini membuktikan bahwa...`,
            o: {
              A: `Pejuang Indonesia kehabisan dana untuk menyewa gedung di pusat kota Medan.`,
              B: `Perjuangan bersifat teritorial luwes; hilangnya satu kota tidak berarti hancurnya komando perlawanan militer.`,
              C: `Tebing Tinggi memiliki pabrik senjata peninggalan Belanda yang belum dihancurkan.`,
              D: `Pejuang berniat memisahkan diri dari Republik Indonesia dan mendirikan negara Sumatera.`,
              E: `Pihak Sekutu tidak memiliki kendaraan militer untuk mengejar pejuang ke luar kota.`
            },
            a: `B`,
            p: `Taktik gerilya selalu mengandalkan desa sebagai basis pertahanan (hinterland). Dengan mundur dari kota, pejuang menyatukan komando di pinggiran untuk terus merongrong musuh di dalam kota dan memutus suplai kebutuhan Sekutu yang disalurkan dari luar kota.`
          },
          {
            id: 79,
            q: `Brigadir Jenderal T.E.D. Kelly bertindak sangat reaktif pasca insiden Jalan Bali dengan mengeluarkan ultimatum agar pemuda Medan menyerahkan senjata mereka. Jika dianalisis, mengapa ultimatum Kelly ini justru menjadi blunder yang memperluas pertempuran?`,
            o: {
              A: `Pemuda Medan sama sekali tidak memiliki senjata untuk diserahkan.`,
              B: `Ultimatum tersebut diterjemahkan keliru oleh penerjemah lokal.`,
              C: `Pemuda Indonesia menganggap pelucutan senjata sama dengan merampas harga diri proklamasi, yang justru memprovokasi emosi dan menyatukan seluruh laskar untuk menyerang.`,
              D: `Ultimatum tersebut melanggar kesepakatan langsung antara Soekarno dan Ratu Belanda.`,
              E: `Jenderal Kelly hanya mengancam tanpa memiliki pasukan yang nyata.`
            },
            a: `C`,
            p: `Ancaman dan paksaan menyerahkan senjata kepada bangsa yang baru merdeka selalu diartikan sebagai upaya mengembalikan penjajahan. Bukannya takut, ultimatum tersebut malah menjadi pemantik yang menyolidkan seluruh faksi pemuda untuk melawan Sekutu secara frontal.`
          },
          {
            id: 80,
            q: `Puncak ketegangan "Medan Area" membuktikan kegagalan Sekutu (Inggris) sebagai pasukan perdamaian internasional, karena…`,
            o: {
              A: `Sekutu gagal menemukan lokasi tambang minyak di Sumatera.`,
              B: `Sekutu secara nyata memihak dan menjadi alat bagi NICA (Belanda) untuk merestorasi kekuasaan kolonial, melanggar mandat awal kedatangan mereka.`,
              C: `Inggris menarik seluruh pasukannya sebelum pertempuran terjadi.`,
              D: `Tentara Sekutu melakukan pemberontakan terhadap Jenderal Kelly.`,
              E: `PBB mencabut hak veto Inggris setelah pertempuran tersebut.`
            },
            a: `B`,
            p: `Status awal Sekutu adalah netral (hanya mengurus tawanan perang). Kegagalan terbesar mereka secara politik adalah membiarkan diri mereka diboncengi oleh NICA dan turut campur menekan republik, yang membuat mereka kehilangan kepercayaan dari pihak Indonesia.`
          },
          {
            id: 81,
            q: `Secara geografis dan taktis, kota Ambarawa memiliki arti yang sangat penting bagi kedua belah pihak yang bertikai. Mengapa militer Sekutu sangat berkepentingan menguasai wilayah Ambarawa dan Magelang?`,
            o: {
              A: `Terdapat cadangan emas peninggalan Belanda yang tertimbun di benteng Ambarawa.`,
              B: `Ambarawa adalah jalur lalu lintas strategis (nadi penghubung) yang memegang kendali akses dari pesisir Semarang menuju wilayah pedalaman (Yogyakarta) yang menjadi pusat kekuatan RI.`,
              C: `Wilayah tersebut memiliki bandara internasional terbesar di Jawa.`,
              D: `Penduduk Ambarawa secara resmi menyatakan diri bergabung dengan negara Belanda.`,
              E: `PBB menunjuk Ambarawa sebagai zona netral bebas militer.`
            },
            a: `B`,
            p: `Ambarawa berada di posisi "leher" Jawa Tengah. Siapapun yang menguasai Ambarawa bisa mengontrol pergerakan militer dari pantai utara (Semarang) menuju pedalaman Jawa Tengah (termasuk Yogyakarta dan Surakarta). Itulah mengapa TKR mati-matian mencegah Sekutu meluas dari wilayah ini.`
          },
          {
            id: 82,
            q: `Keberhasilan TKR memukul mundur Sekutu dari Ambarawa ke Semarang dijadikan sebagai Hari Juang Kartika (Hari Infanteri). Analisis di balik penetapan hari tersebut bagi sejarah TNI adalah…`,
            o: {
              A: `Untuk mengenang persenjataan modern yang berhasil dibeli dari luar negeri.`,
              B: `Bukti bahwa taktik infanteri (pasukan darat/pejalan kaki) dengan strategi tradisional dan semangat juang mampu mematahkan kekuatan kavaleri/artileri modern musuh.`,
              C: `Mengenang peran Angkatan Udara yang pertama kali berhasil menjatuhkan bom di Ambarawa.`,
              D: `Menandai berakhirnya campur tangan militer internasional di Indonesia.`,
              E: `Sebagai peringatan perdamaian militer antara TKR dan tentara sekutu Inggris.`
            },
            a: `B`,
            p: `TKR saat itu mengandalkan infanteri murni (pasukan darat tanpa tank atau pesawat yang memadai). Kemenangan Ambarawa membuktikan bahwa mobilitas dan kegigihan infanteri yang merakyat merupakan kekuatan inti pertahanan Indonesia.`
          },
          {
            id: 83,
            q: `Dalam strategi "Supit Urang" yang diterapkan Sudirman, keberhasilan pengepungan sangat bergantung pada kolaborasi berbagai batalion (seperti dari Surakarta, Salatiga, dan Purwokerto). Nilai sosiologis dari strategi gabungan ini adalah…`,
            o: {
              A: `Persaingan antar daerah untuk menunjukkan siapa laskar terkuat.`,
              B: `Kuatnya ikatan ego kedaerahan yang sulit disatukan dalam militer.`,
              C: `Solidaritas dan peleburan identitas lokal ke dalam satu komando nasional (TKR) demi tujuan bersama mempertahankan NKRI.`,
              D: `Kelemahan komando Sudirman yang terpaksa meminjam pasukan dari berbagai daerah.`,
              E: `Strategi tersebut murni diatur oleh tokoh-tokoh politik sipil di Jakarta.`
            },
            a: `C`,
            p: `Pengerahan pasukan dari berbagai wilayah Jawa Tengah menunjukkan bahwa TKR bukan pasukan kedaerahan yang terpecah, melainkan sebuah instrumen negara yang memiliki kesadaran nasional untuk saling membantu wilayah lain yang diserang penjajah.`
          },
          {
            id: 84,
            q: `Sekutu/Inggris sering kali berlindung di balik benteng peninggalan Belanda (Willem I) selama di Ambarawa. Secara taktis, apa yang dilakukan TKR untuk menghadapi musuh yang bertahan di benteng pertahanan kokoh?`,
            o: {
              A: `Membangun benteng baru yang lebih tinggi di seberang Ambarawa.`,
              B: `Menggunakan taktik pengepungan konstan untuk memutus akses air, makanan, dan amunisi sehingga musuh terisolasi dan kelelahan secara psikologis.`,
              C: `Menunggu Sekutu keluar dari benteng secara damai melalui diplomasi.`,
              D: `Menggunakan tank-tank raksasa rampasan dari Jepang untuk menghancurkan tembok.`,
              E: `Menyewa pesawat komersial untuk menjatuhkan logistik di dalam benteng.`
            },
            a: `B`,
            p: `Karena TKR tidak memiliki alat peledak/meriam besar penghancur benteng, taktik Supit Urang digunakan untuk melingkari benteng dari semua sisi. Pengepungan total ini mencekik suplai musuh, memaksa mereka lari meninggalkan benteng dan mundur ke Semarang.`
          },
          {
            id: 85,
            q: `I Gusti Ngurah Rai menamai pasukannya sebagai "Ciung Wanara". Dari segi psikologis sejarah perjuangan kemerdekaan, penamaan pasukan menggunakan elemen historis dan kearifan lokal bertujuan untuk...`,
            o: {
              A: `Mengelabui intelijen Belanda dengan nama yang terdengar seperti kelompok seniman.`,
              B: `Membangkitkan spirit kepahlawanan, keberanian mitologis, dan kebanggaan identitas lokal yang siap berkorban demi negara.`,
              C: `Meminta perlindungan dari raja-raja masa lalu melalui ritual mistis.`,
              D: `Mengisolasi pasukan Bali agar tidak diganggu oleh pasukan dari pulau Jawa.`,
              E: `Menunjukkan kepada dunia internasional bahwa Indonesia belum memiliki tentara modern.`
            },
            a: `B`,

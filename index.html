            p: `Menggunakan nama yang merujuk pada pahlawan/mitos keperkasaan di masa lampau (Ciung Wanara) efektif memompa moral pasukan (esprit de corps) dengan menanamkan keberanian dan kebanggaan kultur lokal yang terintegrasi pada nasionalisme Indonesia.`
          },
          {
            id: 86,
            q: `Desa Margarana dipilih oleh Ngurah Rai sebagai rute konsolidasi sebelum terkepung. Secara geografis, wilayah perdesaan dan ngarai di Bali sering dimanfaatkan pejuang untuk...`,
            o: {
              A: `Membangun landasan pacu pesawat kecil.`,
              B: `Mencari keuntungan ekonomi dengan mengumpulkan pajak dari petani lokal.`,
              C: `Menerapkan taktik perang gerilya dengan bersembunyi (kamuflase) dan menggalang dukungan rakyat secara sembunyi-sembunyi dari pantauan udara NICA.`,
              D: `Mengundang tentara Sekutu untuk beristirahat secara damai.`,
              E: `Menyerahkan diri secara diam-diam agar tidak diketahui marksa pusat.`
            },
            a: `C`,
            p: `Perang revolusi adalah perang rakyat. Wilayah pedesaan/hutan di Bali menjadi basis teraman untuk taktik gerilya (hit-and-run) dan menyembunyikan pasukan dari patroli Belanda, sekaligus memperoleh dukungan logistik dari rakyat lokal.`
          },
          {
            id: 87,
            q: `Belanda mengutus Kapten J.B.T. Konig untuk membujuk Ngurah Rai berdamai. Di saat yang sama, tokoh lokal pro-Belanda, Tjokorda Gde Raka Soekawati, dijadikan Presiden Negara Indonesia Timur (NIT). Fenomena diplomasi ini membuktikan taktik klasik Belanda, yaitu...`,
            o: {
              A: `Asimilasi budaya Eropa ke dalam tradisi bangsawan Nusantara.`,
              B: `Devide et Impera (pecah belah), dengan memanfaatkan elit lokal ambisius untuk mendirikan negara boneka guna melawan kekuatan republikan.`,
              C: `Pemberian kemerdekaan secara bertahap kepada kerajaan-kerajaan timur.`,
              D: `Menyamakan status ekonomi pejabat lokal dengan perwira militer Belanda.`,
              E: `Taktik bumi hangus sosial yang membangkrutkan kerajaan lokal.`
            },
            a: `B`,
            p: `Mengangkat elit lokal menjadi pejabat di negara boneka (NIT) dan merayu panglima republik untuk takluk adalah taktik Devide et Impera. Belanda memecah belah persatuan bangsa dengan menciptakan iming-iming kekuasaan lokal.`
          },
          {
            id: 88,
            q: `Meskipun Ngurah Rai dan seluruh pasukannya gugur di Margarana (kekalahan tempur), peristiwa tragis ini menjadi bumerang politik bagi eksistensi Negara Indonesia Timur (NIT) bentukan Belanda. Mengapa demikian?`,
            o: {
              A: `Belanda kehabisan dana operasi militer dan bangkrut di wilayah timur.`,
              B: `Pengorbanan Puputan membangkitkan simpati internasional dan membuka mata publik bahwa rakyat Bali sejati tidak menyetujui pendirian NIT.`,
              C: `PBB memerintahkan Presiden NIT untuk mengundurkan diri saat itu juga.`,
              D: `Militer Belanda di Bali membelot dan bergabung dengan TNI karena merasa bersalah.`,
              E: `Peristiwa tersebut menyebabkan gunung meletus dan menghancurkan markas Belanda.`
            },
            a: `B`,
            p: `Puputan mematahkan propaganda Belanda. Belanda selalu berkata bahwa NIT didirikan murni karena keinginan rakyat Timur. Dengan matinya Ngurah Rai, dunia tahu bahwa NIT adalah bentuk pemaksaan kolonial yang dilawan mati-matian oleh sebagian besar rakyatnya sendiri.`
          },
          {
            id: 89,
            q: `Sebelum pecah pertempuran 10 November, insiden perobekan bendera Belanda (Merah-Putih-Biru) menjadi Merah-Putih di Hotel Yamato terjadi pada bulan September. Insiden ini membuktikan bahwa katalis utama konflik di Surabaya berakar dari…`,
            o: {
              A: `Kebijakan pajak perhotelan yang memberatkan kaum pedagang Surabaya.`,
              B: `Arogansi sekelompok orang Belanda yang memancing provokasi terhadap sentimen kedaulatan yang sedang menyala di hati rakyat Indonesia.`,
              C: `Kesalahan koordinasi pemerintahan Jepang sebelum meninggalkan hotel tersebut.`,
              D: `Instruksi langsung dari Presiden Soekarno untuk menghapus simbol asing.`,
              E: `Perebutan gedung bersejarah antara Sekutu dan milisi lokal.`
            },
            a: `B`,
            p: `Kelompok Belanda yang baru dibebaskan (APWI) dengan arogan mengibarkan bendera triwarna di Surabaya, memicu kemarahan karena tindakan itu tidak menghargai kemerdekaan RI yang telah diproklamasikan. Sentimen kedaulatan inilah akar utama ledakan amarah rakyat.`
          },
          {
            id: 90,
            q: `Pasukan Inggris pimpinan Jenderal Mansergh mengandalkan kekuatan artileri laut dan darat yang masif karena mereka gagal mengantisipasi bentuk perlawanan "perang semesta". Kegagalan intelijen Inggris memahami perang semesta ini terlihat dari asumsi mereka bahwa…`,
            o: {
              A: `Rakyat Surabaya akan menyerah jika pemimpin militernya ditangkap, padahal perlawanan dilakukan mandiri oleh rakyat, laskar, dan santri tanpa hierarki militer yang kaku.`,
              B: `Surabaya tidak memiliki cadangan makanan sehingga akan mudah ditaklukkan melalui blokade ekonomi.`,
              C: `Pasukan Jepang akan membantu Sekutu melawan TKR.`,
              D: `Hujan lebat akan melumpuhkan pergerakan pasukan Indonesia.`,
              E: `TKR hanya akan menyerang di malam hari.`
            },
            a: `A`,
            p: `Militer klasik Eropa berasumsi perang hanya dimainkan oleh militer resmi. Saat komando militer lumpuh, perang berakhir. Namun di Surabaya, ketika pemimpin resmi pergi, laskar kiai, pemuda, dan rakyat biasa otomatis mengangkat senjata (Perang Semesta).`
          },
          {
            id: 91,
            q: `Keputusan untuk menolak ultimatum Mayor Jenderal Mansergh tidak hanya diambil oleh elemen militer, tetapi didukung secara mutlak oleh Gubernur Jawa Timur (Suryo) pada 9 November 1945 malam. Posisi Gubernur Suryo ini sangat penting secara yuridis dan politis karena...`,
            o: {
              A: `Beliau menjanjikan gaji besar bagi pemuda yang bersedia maju ke medan perang.`,
              B: `Mengesahkan penolakan tersebut sebagai sikap resmi pemerintah Republik Indonesia di Jawa Timur, yang melegitimasi bahwa perlawanan rakyat adalah tindakan negara, bukan pemberontakan liar.`,
              C: `Gubernur Suryo memiliki kewenangan menembakkan meriam artileri pantai.`,
              D: `Ia adalah tokoh yang paling ditakuti oleh pasukan Inggris karena kemampuannya berbahasa asing.`,
              E: `Sebagai jaminan bahwa PBB akan membantu jika terjadi pertumpahan darah.`
            },
            a: `B`,
            p: `Keputusan Gubernur Suryo memberikan status hukum (legalitas pemerintahan) bahwa perang yang akan dilakukan esok hari (10 November) adalah perang membela kehormatan negara yang direstui oleh institusi negara yang sah.`
          },
          {
            id: 92,
            q: `Pertempuran heroik 10 November 1945 mengundang perhatian jurnalis internasional. Secara diplomasi global, perlawanan dahsyat rakyat Surabaya ini mengubah persepsi dunia Barat karena...`,
            o: {
              A: `Mengancam keamanan jalur laut internasional di Selat Madura.`,
              B: `Menghapus mitos kehebatan armada laut Inggris.`,
              C: `Meruntuhkan propaganda NICA yang menyebut Indonesia tidak pantas merdeka dan membuktikan keteguhan nyata rakyat Indonesia untuk menolak dijajah kembali dengan harga apa pun.`,
              D: `Membuat negara-negara persemakmuran Inggris (Australia dan India) menjajah Indonesia secara bersama.`,
              E: `Memaksa PBB memindahkan kantor pusatnya ke Indonesia.`
            },
            a: `C`,
            p: `Media asing melihat langsung bahwa bukan hanya tentara yang melawan, tapi ibu-ibu, pemuda, santri, bahkan anak-anak. Ini mematikan propaganda NICA yang mengatakan bahwa kemerdekaan Indonesia hanya dimaui segelintir politisi elitis (fasis). Dunia pun mulai bersimpati pada Indonesia.`
          },
          {
            id: 93,
            q: `Keputusan Kolonel A.H. Nasution untuk mematuhi perintah Perdana Menteri Sjahrir agar TRI meninggalkan Bandung, meskipun mendapat tekanan dari bawahannya yang ingin terus bertempur, menunjukkan sikap…`,
            o: {
              A: `Ketakutan panglima militer terhadap kekuatan meriam Sekutu.`,
              B: `Ketaatan pada asas hierarki dan supremasi sipil dalam pemerintahan yang demokratis demi menyukseskan grand-strategy diplomasi negara.`,
              C: `Pembangkangan diam-diam terhadap instruksi Presiden Soekarno.`,
              D: `Keinginan Nasution untuk memindahkan ibu kota provinsi ke Tasikmalaya.`,
              E: `Keputusasaan karena tidak mendapatkan bantuan persenjataan dari Yogyakarta.`
            },
            a: `B`,
            p: `Di masa republik yang baru berdiri, kepatuhan militer (Nasution) pada keputusan elit pemerintahan sipil (Sjahrir) menunjukkan profesionalisme. Meski pahit (harus mundur), militer sadar bahwa strategi diplomasi internasional yang dijalankan PM Sjahrir adalah bagian dari perjuangan mempertahankan kemerdekaan.`
          },
          {
            id: 94,
            q: `Majelis Persatuan Perjuangan Priangan (MP3) memainkan peran penting sebelum peristiwa pembumihangusan. Keterlibatan forum yang terdiri dari tokoh militer dan masyarakat sipil lokal ini dalam mengambil keputusan membuktikan bahwa...`,
            o: {
              A: `Militer Indonesia kebingungan dan tidak memiliki strategi mandiri.`,
              B: `Keputusan bumi hangus bukan tindakan sepihak tentara, melainkan konsensus yang lahir dari kegelisahan dan partisipasi kolektif rakyat Jawa Barat.`,
              C: `Keputusan perang harus selalu menunggu hasil voting internasional.`,
              D: `Sekutu berhasil menyusapkan mata-mata ke dalam forum masyarakat.`,
              E: `Pemerintah pusat di Jakarta sudah tidak diakui kekuasaannya di wilayah Priangan.`
            },
            a: `B`,
            p: `MP3 adalah wadah musyawarah elemen sipil dan pejuang. Kebijakan "Bandung Lautan Api" diputuskan secara bersama, menunjukkan perlawanan dan pengorbanan (menghancurkan rumah sendiri) ini didukung oleh nurani rakyat secara kolektif demi tidak jatuh ke tangan penjajah.`
          },
          {
            id: 95,
            q: `Selain mencegah Sekutu memanfaatkan fasilitas kota, pembakaran Bandung Selatan memberi dampak strategis jangka menengah bagi peperangan yang berlanjut. Hancurnya infrastruktur Bandung Selatan mengakibatkan...`,
            o: {
              A: `Pasukan Republik mudah dikalahkan di pedesaan karena kehilangan pelindung.`,
              B: `Agresi Militer Belanda dan mobilitas Sekutu untuk menembus wilayah pedalaman Jawa Barat menjadi sangat terhambat akibat hilangnya basis logistik perkotaan.`,
              C: `Penduduk Bandung menjadi kaya mendadak dari asuransi perang.`,
              D: `Sekutu secara sukarela membangun fasilitas kota yang lebih modern.`,
              E: `PBB menghukum Sjahrir karena merusak fasilitas ekonomi.`
            },
            a: `B`,
            p: `Pasukan kolonial sangat bergantung pada fasilitas kota (listrik, jalan, gudang, gedung telekomunikasi). Tanpa fasilitas ini, pergerakan operasi militer musuh ke pegunungan (pedalaman Jawa Barat) untuk mengejar laskar Siliwangi menjadi tersendat dan penuh risiko logistik.`
          },
          {
            id: 96,
            q: `Eksodus ribuan warga Bandung melahirkan ikatan batin kuat yang diabadikan dalam lagu "Halo-Halo Bandung". Dalam analisis sosial sejarah, lagu perjuangan dan karya seni yang lahir dari tragedi (seperti bumi hangus) berfungsi vital sebagai…`,
            o: {
              A: `Media hiburan para prajurit untuk menghilangkan stres selama perang.`,
              B: `Alat propaganda Belanda untuk menarik simpati rakyat.`,
              C: `Monumen memori kolektif yang merawat optimisme ("sekarang telah menjadi lautan api, mari Bung rebut kembali") dan mentransfer semangat perjuangan antar generasi.`,
              D: `Laporan kronologis resmi yang harus diserahkan kepada Mahkamah Internasional PBB.`,
              E: `Lagu kebangsaan sementara sebelum Indonesia Raya kembali dinyanyikan.`
            },
            a: `C`,
            p: `Lagu perjuangan bukan sekadar hiburan. Liriknya merangkum janji sejarah ("merebut kembali"). Lagu ini menjaga memori bangsa, membangun militansi psikologis, dan merawat harapan (resilience) di tengah penderitaan pengungsian.`
          },
          {
            id: 97,
            q: `Dalam Serangan Umum 1 Maret, target utama pendudukan selama 6 jam adalah wilayah pusat ibu kota Yogyakarta (seperti Kantor Pos, Stasiun, Istana Kepresidenan/Gedung Agung). Dari sudut pandang strategi "psy-war" (perang psikologis), penaklukan objek vital ibu kota ini bertujuan untuk…`,
            o: {
              A: `Menghientikan total jalur kereta api antarprovinsi secara permanen.`,
              B: `Menghancurkan moral militer Belanda secara telak karena jantung pertahanan simbolik mereka bisa dibobol dengan mudah pada siang bolong.`,
              C: `Mengamankan persediaan emas nasional yang disimpan di ruang bawah tanah keraton.`,
              D: `Mencuri teknologi mesin telegram Belanda untuk komunikasi militer TNI.`,
              E: `Membebaskan tawanan sipil yang dihukum di dalam benteng Vredeburg.`
            },
            a: `B`,
            p: `Menguasai fasilitas pusat pemerintahan/ibu kota adalah penanda supremasi militer. Berhasil menduduki wilayah paling dijaga oleh Belanda (di sekitar Gedung Agung & Kantor Pos) di siang hari merupakan tamparan psikologis sangat keras bagi ego komando militer Belanda.`
          },
          {
            id: 98,
            q: `Sistem pertahanan "Wehrkreise" yang diadopsi dari taktik Jerman digunakan oleh TNI di bawah komando Letkol Soeharto dan Jenderal Sudirman. Konsep utama dari taktik gerilya Wehrkreise ini, yang berujung pada suksesnya SU 1 Maret adalah…`,
            o: {
              A: `Mengumpulkan jutaan tentara dalam satu garis lurus seperti perang parit.`,
              B: `Desentralisasi komando, di mana pasukan dibagi ke dalam kantong-kantong pertahanan wilayah (circle) yang mandiri namun dapat menyerang secara serentak ke satu titik pusat (Yogyakarta).`,
              C: `Menggunakan seragam tentara musuh untuk menyerang dari dalam markas.`,
              D: `Membangun benteng beton melingkar di perbatasan kota.`,
              E: `Taktik bertahan statis tanpa melakukan serangan inisiatif sedikit pun.`
            },
            a: `B`,
            p: `Wehrkreise adalah sistem kantong teritorial. Pasukan dipecah dan menyebar secara mandiri di wilayah pedesaan (kantong gerilya), yang kebal terhadap serangan.`
          },
          {
            id: 99,
            q: `Menjelang Serangan 1 Maret, pasukan Belanda bersikap sangat santai (overconfident) dan mengira situasi keamanan Yogyakarta sepenuhnya aman. Blunder analisa intelijen Belanda ini disebabkan oleh keyakinan mereka bahwa…`,
            o: {
              A: `Pasukan TNI sedang berlibur akibat musim hujan yang parah.`,
              B: `Dengan tertangkapnya pemimpin politik (Soekarno-Hatta) di Agresi Militer II, mereka beranggapan bahwa perlawanan sipil dan komando militer RI otomatis telah hancur sepenuhnya.`,
              C: `PBB telah mengeluarkan mandat gencatan senjata permanen di Jawa.`,
              D: `Intelijen Belanda telah menyuap seluruh panglima laskar lokal di Yogyakarta.`,
              E: `Mereka meyakini TNI kehabisan peluru pasca pertempuran Surabaya.`
            },
            a: `B`,
            p: `Belanda menggunakan logika kolonial konvensional: jika kepala negara ditangkap dan ibu kota diduduki, maka negara itu mati (Agresi Militer II). Mereka lalai bahwa TNI menganut doktrin bahwa "selama rakyat ada, tentara tetap ada" (perang gerilya).`
          },
          {
            id: 100,
            q: `Kesuksesan Serangan Umum 1 Maret berdampak domino pada posisi diplomasi Indonesia. Terdapat korelasi sebab-akibat yang kuat antara Serangan Umum 1 Maret 1949 dengan Perjanjian Roem-Royen (Mei 1949), yaitu…`,
            o: {
              A: `Serangan tersebut membuat militer Belanda takut sehingga menyerahkan kedaulatan langsung tanpa perundingan.`,
              B: `Peristiwa 1 Maret membuka mata UNCI (PBB) bahwa RI masih utuh, yang berujung pada resolusi tegas PBB yang menekan Belanda agar bersedia duduk di Perundingan Roem-Royen dan mengembalikan RI ke Yogyakarta.`,
              C: `Dalam Perjanjian Roem-Royen, Indonesia dipaksa membayar ganti rugi atas kerusakan kota Yogyakarta.`,
              D: `Serangan 1 Maret menjadi alasan PBB membatalkan Perjanjian Roem-Royen yang sedang berjalan.`,
              E: `Belanda memanfaatkan peristiwa 1 Maret untuk menuduh Indonesia sebagai pihak agresor dalam perjanjian.`
            },
            a: `B`,
            p: `Diplomasi di PBB buntu karena Belanda selalu mengeklaim RI sudah lenyap. Kemenangan SU 1 Maret adalah "bukti hidup" yang dibawa diplomat RI ke PBB. Fakta ini memaksa PBB menekan Belanda untuk menyudahi kebohongan mereka, menghentikan agresi, dan menyepakati Perjanjian Roem-Royen (memulihkan pemerintahan RI).`
          }
        ];

        function App() {
          const [gameState, setGameState] = useState('start'); // start, playing, result
          const [questions, setQuestions] = useState([]);
          const [answers, setAnswers] = useState({});
          const [score, setScore] = useState(0);

          // Fungsi untuk mengacak array (Fisher-Yates Shuffle)
          const shuffleArray = (array) => {
            let newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
          };

          const startQuiz = () => {
            setQuestions(shuffleArray(quizData));
            setAnswers({});
            setScore(0);
            setGameState('playing');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          const handleOptionSelect = (questionId, selectedOption) => {
            setAnswers({
              ...answers,
              [questionId]: selectedOption
            });
          };

          const submitQuiz = () => {
            if (Object.keys(answers).length < questions.length) {
              if (!window.confirm(`Anda baru menjawab ${Object.keys(answers).length} dari 100 soal. Yakin ingin mengumpulkan sekarang?`)) {
                return;
              }
            }

            let correctCount = 0;
            questions.forEach((q) => {
              if (answers[q.id] === q.a) {
                correctCount++;
              }
            });

            const finalScore = Math.round((correctCount / questions.length) * 100);
            setScore(finalScore);
            setGameState('result');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          if (gameState === 'start') {
            return (
              <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-4 font-sans text-gray-800">
                <div className="max-w-2xl bg-white p-8 md:p-12 rounded-2xl shadow-xl text-center">
                  <div className="mb-6 inline-flex items-center justify-center w-20 h-20 bg-blue-100 text-blue-600 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                  </div>
                  <h1 className="text-3xl md:text-4xl font-bold text-gray-900 mb-4">Quiz Sejarah Kemerdekaan RI</h1>
                  <p className="text-gray-600 mb-8 text-lg">
                    Uji pengetahuan Anda mengenai sejarah perjuangan diplomasi dan pertempuran fisik kemerdekaan Indonesia. Terdapat 100 soal pilihan ganda yang urutannya akan diacak secara otomatis.
                  </p>
                  <button 
                    onClick={startQuiz}
                    className="w-full md:w-auto px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-lg transition-all shadow-lg hover:shadow-blue-500/30"
                  >
                    Mulai Quiz Sekarang
                  </button>
                </div>
              </div>
            );
          }

          if (gameState === 'playing') {
            return (
              <div className="min-h-screen bg-gray-50 pb-24 font-sans text-gray-800">
                <header className="bg-white shadow-sm sticky top-0 z-10 px-4 py-4 flex justify-between items-center">
                  <h2 className="font-bold text-lg md:text-xl text-gray-800">Quiz Sedang Berlangsung</h2>
                  <div className="bg-blue-100 text-blue-800 px-4 py-2 rounded-full font-semibold text-sm">
                    Terjawab: {Object.keys(answers).length} / 100
                  </div>
                </header>

                <main className="max-w-4xl mx-auto p-4 mt-6">
                  {questions.map((q, index) => (
                    <div key={q.id} className="bg-white p-6 md:p-8 rounded-xl shadow-sm mb-6 border border-gray-100">
                      <h3 className="text-lg font-semibold mb-4 whitespace-pre-wrap leading-relaxed">
                        <span className="text-blue-600 mr-2">{index + 1}.</span>
                        {q.q}
                      </h3>
                      <div className="space-y-3">
                        {Object.entries(q.o).map(([letter, text]) => {
                          const isSelected = answers[q.id] === letter;
                          return (
                            <label 
                              key={letter}
                              className={`flex items-start p-4 rounded-lg border-2 cursor-pointer transition-all duration-200 ${
                                isSelected ? 'border-blue-500 bg-blue-50' : 'border-gray-200 hover:bg-gray-50'
                              }`}
                            >
                              <input 
                                type="radio" 
                                name={`question-${q.id}`} 
                                value={letter}
                                checked={isSelected}
                                onChange={() => handleOptionSelect(q.id, letter)}
                                className="mt-1 w-5 h-5 text-blue-600 focus:ring-blue-500"
                              />
                              <span className="ml-3 flex-1">
                                <span className="font-bold mr-2">{letter}.</span> {text}
                              </span>
                            </label>
                          );
                        })}
                      </div>
                    </div>
                  ))}

                  <div className="mt-12 text-center">
                    <button 
                      onClick={submitQuiz}
                      className="px-10 py-4 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl text-xl transition-all shadow-lg hover:shadow-green-500/30 w-full md:w-auto"
                    >
                      Kumpulkan Jawaban
                    </button>
                  </div>
                </main>
              </div>
            );
          }

          // State: Result
          return (
            <div className="min-h-screen bg-gray-50 pb-24 font-sans text-gray-800">
              <header className="bg-white shadow-sm px-4 py-6 text-center">
                <h2 className="text-3xl font-bold text-gray-800 mb-2">Hasil Quiz Anda</h2>
                <div className="inline-block mt-4 bg-gray-100 p-6 rounded-2xl border-2 border-gray-200">
                  <p className="text-gray-500 text-sm uppercase tracking-wider font-semibold mb-1">Skor Akhir</p>
                  <p className={`text-6xl font-black ${score >= 70 ? 'text-green-600' : 'text-red-500'}`}>
                    {score} <span className="text-2xl text-gray-400 font-bold">/ 100</span>
                  </p>
                </div>
              </header>

              <main className="max-w-4xl mx-auto p-4 mt-8">
                <div className="mb-6 flex justify-between items-center">
                  <h3 className="text-xl font-bold">Koreksi & Pembahasan</h3>
                  <button 
                    onClick={startQuiz}
                    className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition-colors shadow-md"
                  >
                    Ulangi Quiz
                  </button>
                </div>

                {questions.map((q, index) => {
                  const userAnswer = answers[q.id];
                  const isCorrect = userAnswer === q.a;
                  const isUnanswered = !userAnswer;

                  return (
                    <div key={q.id} className="bg-white p-6 md:p-8 rounded-xl shadow-sm mb-6 border border-gray-100">
                      <div className="flex items-start mb-4">
                        <div className="flex-shrink-0 mt-1 mr-3">
                          {isCorrect ? (
                            <svg className="w-6 h-6 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                              <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
                            </svg>
                          ) : (
                            <svg className="w-6 h-6 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                              <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd" />
                            </svg>
                          )}
                        </div>
                        <h3 className="text-lg font-semibold whitespace-pre-wrap leading-relaxed">
                          <span className="text-gray-500 mr-1">{index + 1}.</span>
                          {q.q}
                        </h3>
                      </div>

                      <div className="space-y-3 ml-9">
                        {Object.entries(q.o).map(([letter, text]) => {
                          const isThisOptionCorrect = letter === q.a;
                          const isThisOptionSelected = letter === userAnswer;
                          
                          let optionClass = "border-gray-200 bg-gray-50 opacity-60"; // Default
                          
                          if (isThisOptionCorrect) {
                            optionClass = "border-green-500 bg-green-50 text-green-900 font-medium";
                          } else if (isThisOptionSelected && !isThisOptionCorrect) {
                            optionClass = "border-red-500 bg-red-50 text-red-900";
                          }

                          return (
                            <div 
                              key={letter}
                              className={`flex items-start p-3 rounded-lg border-2 ${optionClass}`}
                            >
                              <span className="font-bold mr-3 w-6 text-center">{letter}.</span> 
                              <span className="flex-1">{text}</span>
                              
                              {isThisOptionCorrect && <span className="ml-2 text-green-600 font-bold text-sm">✓ Benar</span>}
                              {isThisOptionSelected && !isThisOptionCorrect && <span className="ml-2 text-red-600 font-bold text-sm">✗ Jawaban Anda</span>}
                            </div>
                          );
                        })}
                      </div>
                      
                      {isUnanswered && (
                        <div className="ml-9 mt-3 text-red-500 font-medium text-sm">
                          ⚠️ Anda tidak menjawab soal ini.
                        </div>
                      )}

                      <div className="ml-9 mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                        <h4 className="font-bold text-blue-800 mb-2 flex items-center">
                          <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                          Pembahasan
                        </h4>
                        <p className="text-blue-900 whitespace-pre-wrap text-sm leading-relaxed">
                          {q.p || 'Tidak ada pembahasan spesifik yang diberikan untuk soal ini.'}
                        </p>
                      </div>
                    </div>
                  );
                })}
                
                <div className="mt-8 text-center pb-8">
                    <button 
                      onClick={startQuiz}
                      className="px-8 py-4 bg-gray-800 hover:bg-gray-900 text-white font-bold rounded-xl text-lg transition-all shadow-lg"
                    >
                      Kembali ke Beranda / Ulangi Quiz
                    </button>
                </div>
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
